<div class="app-shell">
  <ng-container [ngSwitch]="currentLayout">
    <app-public-layout-shell *ngSwitchCase="'public-shell'">
      <router-outlet></router-outlet>
    </app-public-layout-shell>

    <app-public-layout-shell *ngSwitchCase="'private-shell'">
      <router-outlet></router-outlet>
    </app-public-layout-shell>

    <router-outlet *ngSwitchDefault></router-outlet>
  </ng-container>

  <nav
    *ngIf="shouldShowMobileNavigation()"
    class="app-shell__mobile-nav"
    aria-label="Navegación principal móvil"
  >
    <a
      *ngFor="let tab of mobileTabs"
      [routerLink]="tab.path"
      class="app-shell__mobile-tab"
      [class.app-shell__mobile-tab--active]="isMobileTabActive(tab)"
      [attr.aria-current]="isMobileTabActive(tab) ? 'page' : null"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
        <path
          [attr.d]="isMobileTabActive(tab) ? tab.iconFilled : tab.iconOutline"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="1.8"
        ></path>
      </svg>
      <span>{{ tab.label }}</span>
    </a>
  </nav>

  <button
    *ngIf="shouldShowMobileChatbotFab()"
    type="button"
    (click)="toggleChatbot()"
    class="app-shell__chat-fab"
    aria-label="Abrir asistente de recomendaciones"
  >
    <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 3 13.8 8.2 19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"></path>
      <path stroke-linecap="round" stroke-linejoin="round" d="M18.5 3.5 19 5l1.5.5L19 6l-.5 1.5L18 6l-1.5-.5L18 5l.5-1.5Z"></path>
    </svg>
  </button>

  <ng-container *ngIf="isChatbotOpen || isChatMinimized">
    <button
      *ngIf="isChatMinimized"
      type="button"
      (click)="restoreChatbot()"
      class="app-shell__chat-minibar"
    >
      <svg class="h-5 w-5 text-[var(--guide-accent)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3 13.8 8.2 19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"></path>
      </svg>
      <span class="flex-1 text-sm font-medium">Recomendaciones</span>
      <svg class="h-4 w-4 text-[var(--portal-text-muted)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"></path>
      </svg>
    </button>

    <div
      *ngIf="isChatbotOpen"
      class="app-shell__chat-overlay"
      [class.app-shell__chat-overlay--desktop]="!shouldShowMobileChatbotFab()"
      [class.invisible]="isChatMinimized"
      [class.pointer-events-none]="isChatMinimized"
      (click)="closeChatbot()"
      (keydown.escape)="closeChatbot()"
      tabindex="-1"
    >
      <div class="app-shell__chat-backdrop"></div>

      <div
        class="app-shell__chat-panel app-shell__chat-panel--mobile md:hidden"
        (click)="$event.stopPropagation()"
        (keydown)="$event.stopPropagation()"
        tabindex="-1"
        [style.transform]="'translateY(' + swipeOffsetY + 'px)'"
        [style.transition]="swipeAnimating ? 'transform 0.3s ease' : 'none'"
      >
        <div
          class="app-shell__chat-handle"
          style="touch-action: none"
          (touchstart)="onSwipePanelStart($event)"
          (touchmove)="onSwipePanelMove($event)"
          (touchend)="onSwipePanelEnd()"
        >
          <div class="app-shell__chat-handle-bar"></div>
        </div>
        <app-unified-chat-shell (close)="minimizeChatbot()"></app-unified-chat-shell>
      </div>
    </div>
  </ng-container>

  <button
    *ngIf="shouldShowDesktopChatbotLauncher() && !isChatbotOpen"
    type="button"
    (click)="toggleChatbot()"
    class="app-shell__chat-launcher"
    aria-label="Abrir asistente de recomendaciones"
  >
    <svg class="h-5 w-5 text-[var(--guide-accent)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 3 13.8 8.2 19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"></path>
      <path stroke-linecap="round" stroke-linejoin="round" d="M18.5 3.5 19 5l1.5.5L19 6l-.5 1.5L18 6l-1.5-.5L18 5l.5-1.5Z"></path>
    </svg>
    Recomendaciones
  </button>

  <div
    *ngIf="shouldShowDesktopChatbotLauncher() && isChatbotOpen"
    class="app-shell__chat-panel app-shell__chat-panel--desktop"
    [style.width.px]="chatPanelWidth"
  >
    <div
      class="app-shell__chat-resize"
      (mousedown)="onResizeStart($event)"
    ></div>
    <app-unified-chat-shell (close)="closeChatbot()"></app-unified-chat-shell>
  </div>

  <app-modal></app-modal>
  <app-auth-login-modal></app-auth-login-modal>
</div>
