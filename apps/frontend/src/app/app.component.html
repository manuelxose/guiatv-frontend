<div class="app-shell font-montserrat bg-gradient-to-br from-gray-900 via-gray-800 to-black min-h-screen flex flex-col">
  <header
    *ngIf="showMobileTopBar"
    class="fixed inset-x-0 top-0 z-[75] h-14 border-b border-slate-800/80 bg-slate-950/95 backdrop-blur-xl md:hidden shadow-[0_8px_24px_rgba(0,0,0,0.45)]"
  >
    <div class="h-full px-4 flex items-center justify-between gap-3">
      <button
        type="button"
        (click)="navigate('/')"
        class="inline-flex items-center justify-center h-10 w-10 rounded-xl border border-slate-700/80 bg-slate-900/70 text-red-300 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-500"
        aria-label="Ir al inicio"
      >
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M10 15.5v-7c0-.41.47-.65.8-.4l4.67 3.5c.27.2.27.6 0 .8l-4.67 3.5c-.33.25-.8.01-.8-.4Zm11.96-4.45c.58 6.26-4.64 11.48-10.9 10.9 -4.43-.41-8.12-3.85-8.9-8.23 -.26-1.42-.19-2.78.12-4.04 .14-.58.76-.9 1.31-.7v0c.47.17.75.67.63 1.16 -.2.82-.27 1.7-.19 2.61 .37 4.04 3.89 7.25 7.95 7.26 4.79.01 8.61-4.21 7.94-9.12 -.51-3.7-3.66-6.62-7.39-6.86 -.83-.06-1.63.02-2.38.2 -.49.11-.99-.16-1.16-.64v0c-.2-.56.12-1.17.69-1.31 1.79-.43 3.75-.41 5.78.37 3.56 1.35 6.15 4.62 6.5 8.4ZM5.5 4C4.67 4 4 4.67 4 5.5 4 6.33 4.67 7 5.5 7 6.33 7 7 6.33 7 5.5 7 4.67 6.33 4 5.5 4Z" />
        </svg>
      </button>

      <p class="text-xs uppercase tracking-[0.2em] text-slate-300 truncate">
        {{ mobileTitle }}
      </p>

      <button
        type="button"
        (click)="openAccountOrAuth()"
        class="inline-flex items-center justify-center h-10 w-10 rounded-xl border border-slate-700/80 bg-slate-900/70 text-slate-200 hover:text-white hover:border-slate-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-500"
        [attr.aria-label]="(isAuthenticated$ | async) ? 'Abrir cuenta' : 'Iniciar sesión'"
      >
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM5 20a7 7 0 1114 0H5z" />
        </svg>
      </button>
    </div>
  </header>

  <div class="flex flex-1 w-full min-h-0">
    <app-left-sidebar></app-left-sidebar>

    <main
      class="flex-1 min-h-0 overflow-x-hidden"
      [ngClass]="{
        'pt-14': showMobileTopBar,
        'pb-[5.35rem]': showMobileBottomNav
      }"
    >
      <router-outlet></router-outlet>
    </main>

    <app-right-sidebar *ngIf="!hideRightSidebar"></app-right-sidebar>
  </div>

  <app-footer class="hidden md:block"></app-footer>

  <nav
    *ngIf="showMobileBottomNav"
    class="fixed bottom-0 inset-x-0 z-[74] md:hidden border-t border-slate-800/90 bg-slate-950/96 backdrop-blur-xl pb-[max(env(safe-area-inset-bottom),0.35rem)] shadow-[0_-10px_24px_rgba(0,0,0,0.5)]"
    aria-label="Navegación principal móvil"
  >
    <div class="grid grid-cols-5 gap-1 px-2 pt-2">
      <button
        *ngFor="let tab of mobileTabs"
        type="button"
        (click)="navigate(tab.path)"
        class="min-h-[56px] rounded-xl text-[11px] font-medium focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-500 flex flex-col items-center justify-center gap-1 transition-colors"
        [attr.aria-label]="tab.label"
        [attr.aria-current]="isTabActive(tab.path) ? 'page' : null"
        [ngClass]="
          isTabActive(tab.path)
            ? 'text-white bg-red-600/20 border border-red-500/40'
            : 'text-slate-400 border border-transparent hover:text-slate-200'
        "
      >
        <span class="h-5 w-5" [ngSwitch]="tab.key" aria-hidden="true">
          <svg *ngSwitchCase="'home'" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 11l9-7 9 7M5 10v10h14V10" />
          </svg>
          <svg *ngSwitchCase="'guia-canales'" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 3v4M16 3v4M3 11h18" />
          </svg>
          <svg *ngSwitchCase="'que-ver-hoy'" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <svg *ngSwitchCase="'en-directo'" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 12a7 7 0 0114 0M8 12a4 4 0 018 0M12 12h.01" />
          </svg>
          <svg *ngSwitchCase="'comunidad'" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5V4H2v16h5m10 0v-2a3 3 0 00-3-3H10a3 3 0 00-3 3v2m10-9a3 3 0 11-6 0 3 3 0 016 0zm-8 0a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          <svg *ngSwitchDefault class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM5 20a7 7 0 1114 0H5z" />
          </svg>
        </span>
        <span>{{ tab.label }}</span>
      </button>
    </div>
  </nav>

  <app-modal></app-modal>
  <app-auth-login-modal></app-auth-login-modal>
  <app-desktop-chat-dock></app-desktop-chat-dock>
</div>
