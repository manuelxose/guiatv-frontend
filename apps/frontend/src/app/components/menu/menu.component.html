<nav class="flex flex-col gap-6 text-slate-100">
  <section class="space-y-2">
    <p class="px-3 text-[11px] font-semibold uppercase tracking-[0.28em] text-slate-500">Principal</p>
    <button
      *ngFor="let route of primaryRoutes"
      type="button"
      (click)="navigateTo(route)"
      class="flex min-h-[44px] w-full items-center rounded-2xl px-4 text-left text-sm font-semibold transition-colors"
      [ngClass]="isActive(route)
        ? 'bg-red-600 text-white'
        : 'border border-slate-800 bg-slate-900/80 text-slate-300 hover:border-slate-700 hover:text-white'"
    >
      {{ route.label }}
    </button>
  </section>

  <section class="space-y-2">
    <p class="px-3 text-[11px] font-semibold uppercase tracking-[0.28em] text-slate-500">Explorar</p>
    <button
      *ngFor="let route of secondaryRoutes"
      type="button"
      (click)="navigateTo(route)"
      class="flex min-h-[42px] w-full items-center rounded-2xl px-4 text-left text-sm font-semibold transition-colors"
      [ngClass]="isActive(route)
        ? 'bg-slate-100 text-slate-900'
        : 'border border-slate-800 bg-slate-900/80 text-slate-300 hover:border-slate-700 hover:text-white'"
    >
      {{ route.label }}
    </button>
  </section>

  <section class="space-y-2" *ngIf="resourceRoutes.length">
    <p class="px-3 text-[11px] font-semibold uppercase tracking-[0.28em] text-slate-500">Recursos</p>
    <button
      *ngFor="let route of resourceRoutes"
      type="button"
      (click)="navigateTo(route)"
      class="flex min-h-[42px] w-full items-center rounded-2xl px-4 text-left text-sm font-semibold transition-colors"
      [ngClass]="isActive(route)
        ? 'bg-slate-100 text-slate-900'
        : 'border border-slate-800 bg-slate-900/80 text-slate-300 hover:border-slate-700 hover:text-white'"
    >
      {{ route.label }}
    </button>
  </section>

  <section class="space-y-2" *ngIf="toolRoutes.length">
    <p class="px-3 text-[11px] font-semibold uppercase tracking-[0.28em] text-slate-500">Herramientas</p>
    <button
      *ngFor="let route of toolRoutes"
      type="button"
      (click)="navigateTo(route)"
      class="flex min-h-[42px] w-full items-center rounded-2xl px-4 text-left text-sm font-semibold transition-colors"
      [ngClass]="isActive(route)
        ? 'bg-slate-100 text-slate-900'
        : 'border border-slate-800 bg-slate-900/80 text-slate-300 hover:border-slate-700 hover:text-white'"
    >
      {{ route.label }}
    </button>
  </section>

  <section class="space-y-2">
    <p class="px-3 text-[11px] font-semibold uppercase tracking-[0.28em] text-slate-500">Usuario</p>
    <button
      *ngFor="let route of userRoutes"
      type="button"
      (click)="navigateTo(route)"
      class="flex min-h-[42px] w-full items-center rounded-2xl px-4 text-left text-sm font-semibold transition-colors"
      [ngClass]="isActive(route)
        ? 'bg-slate-100 text-slate-900'
        : 'border border-slate-800 bg-slate-900/80 text-slate-300 hover:border-slate-700 hover:text-white'"
    >
      {{ route.label }}
    </button>

    <button
      *ngIf="isAuthenticated$ | async"
      type="button"
      (click)="logout()"
      class="flex min-h-[42px] w-full items-center rounded-2xl border border-slate-800 bg-slate-900/80 px-4 text-left text-sm font-semibold text-slate-300 transition-colors hover:border-red-500/30 hover:text-red-200"
    >
      Cerrar sesión
    </button>
  </section>
</nav>
