<section class="subnav" *ngIf="cards.length" aria-label="Capas editoriales y accesos rápidos">
  <a
    *ngFor="let card of cards; trackBy: trackByCard"
    [routerLink]="card.path"
    [queryParams]="card.queryParams"
    class="subnav__card"
    [class.subnav__card--home]="card.tone === 'home'"
    [class.subnav__card--live]="card.tone === 'live'"
    [class.subnav__card--discover]="card.tone === 'discover'"
    [class.subnav__card--streaming]="card.tone === 'streaming'"
    [class.subnav__card--sports]="card.tone === 'sports'"
    [class.subnav__card--editorial]="card.tone === 'editorial'"
    [class.subnav__card--rankings]="card.tone === 'rankings'"
  >
    <p>{{ card.eyebrow }}</p>
    <h2>{{ card.title }}</h2>
    <span>{{ card.description }}</span>
    <strong>{{ card.action }}</strong>
  </a>
</section>
