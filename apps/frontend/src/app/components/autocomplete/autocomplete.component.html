<div class="relative w-full">
  <!-- Search Input with Dropdown -->
  <div class="relative flex items-center">
    <!-- Filter Dropdown Button -->
    <div class="relative">
      <button 
        (click)="toggleDropdown()"
        class="h-full px-4 py-3 bg-gray-700/40 backdrop-blur-sm border border-gray-600/50 border-r-0 rounded-l-xl text-sm font-semibold flex items-center gap-2 hover:bg-gray-700/60 transition-all min-w-[120px]"
        [ngClass]="getFilterButtonClass()"
      >
        <span>{{ getFilterLabel() }}</span>
        <svg class="w-4 h-4 transition-transform" [ngClass]="{'rotate-180': isDropdownOpen}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
      </button>
      
      <!-- Dropdown Menu -->
      <div 
        *ngIf="isDropdownOpen"
        class="absolute top-full left-0 mt-1 w-48 bg-gray-800/95 backdrop-blur-md border border-gray-700/60 rounded-xl shadow-2xl z-50 overflow-hidden"
      >
        <button 
          (click)="setFilter('all')"
          class="w-full px-4 py-3 text-left text-sm font-medium flex items-center gap-3 hover:bg-gray-700/60 transition-all"
          [ngClass]="activeFilter === 'all' ? 'bg-red-500/20 text-red-300' : 'text-gray-300'"
        >
          <span class="w-2 h-2 rounded-full bg-red-500"></span>
          Todos
        </button>
        <button 
          (click)="setFilter('tv')"
          class="w-full px-4 py-3 text-left text-sm font-medium flex items-center gap-3 hover:bg-gray-700/60 transition-all"
          [ngClass]="activeFilter === 'tv' ? 'bg-emerald-500/20 text-emerald-300' : 'text-gray-300'"
        >
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
          TV
        </button>
        <button 
          (click)="setFilter('streaming')"
          class="w-full px-4 py-3 text-left text-sm font-medium flex items-center gap-3 hover:bg-gray-700/60 transition-all"
          [ngClass]="activeFilter === 'streaming' ? 'bg-sky-500/20 text-sky-300' : 'text-gray-300'"
        >
          <span class="w-2 h-2 rounded-full bg-sky-500"></span>
          Streaming
        </button>
        <button 
          (click)="setFilter('movies')"
          class="w-full px-4 py-3 text-left text-sm font-medium flex items-center gap-3 hover:bg-gray-700/60 transition-all"
          [ngClass]="activeFilter === 'movies' ? 'bg-amber-500/20 text-amber-300' : 'text-gray-300'"
        >
          <span class="w-2 h-2 rounded-full bg-amber-500"></span>
          Películas
        </button>
        <button 
          (click)="setFilter('series')"
          class="w-full px-4 py-3 text-left text-sm font-medium flex items-center gap-3 hover:bg-gray-700/60 transition-all"
          [ngClass]="activeFilter === 'series' ? 'bg-violet-500/20 text-violet-300' : 'text-gray-300'"
        >
          <span class="w-2 h-2 rounded-full bg-violet-500"></span>
          Series
        </button>
      </div>
    </div>

    <!-- Search Icon -->
    <span class="absolute left-[140px] text-gray-400 pointer-events-none z-10">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
        />
      </svg>
    </span>
    
    <!-- Input -->
    <input
      type="text"
      [formControl]="dataInput"
      [matAutocomplete]="auto"
      class="w-full pl-16 pr-4 py-3 bg-gray-800/60 border border-gray-700/60 rounded-r-xl text-white placeholder-gray-400 focus:outline-none focus:border-red-500/60 focus:ring-2 focus:ring-red-500/20 transition-all backdrop-blur-sm"
      [placeholder]="getPlaceholder()"
      matInput
      (focus)="closeDropdown()"
    />
  </div>

  <!-- Autocomplete Dropdown -->
  <mat-autocomplete
    autoActiveFirstOption
    #auto="matAutocomplete"
    [displayWith]="displayFn.bind(this)"
    class="autocomplete-panel"
  >
    <ng-container *ngIf="filteredData | async as options">
      <ng-container *ngFor="let option of options">
        <mat-option
          [value]="option"
          (onSelectionChange)="$event.source?.selected && navigateTo(option)"
          class="autocomplete-option"
        >
          <div class="flex items-center gap-3 py-2">
            <!-- Image/Icon -->
            <div class="w-12 h-12 rounded-lg overflow-hidden flex-shrink-0 bg-gray-700 border border-gray-600">
              <img
                class="w-full h-full object-cover"
                [src]="getOptionImage(option)"
                [alt]="getOptionTitle(option)"
                loading="lazy"
                (error)="onImageError($event)"
              />
            </div>
            
            <!-- Content -->
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 mb-1">
                <span class="font-semibold text-white text-sm truncate">
                  {{ getOptionTitle(option) }}
                </span>
                <span class="text-xs px-2 py-0.5 rounded-full border flex-shrink-0"
                  [ngClass]="getTypeBadgeClass(option)">
                  {{ getItemType(option) }}
                </span>
              </div>
              <span class="text-xs text-gray-400">
                {{ getOptionSubtitle(option) }}
              </span>
            </div>
          </div>
        </mat-option>
      </ng-container>
    </ng-container>
  </mat-autocomplete>
</div>

<!-- Backdrop to close dropdown -->
<div 
  *ngIf="isDropdownOpen" 
  class="fixed inset-0 z-40" 
  (click)="closeDropdown()"
  (keydown.escape)="closeDropdown()"
  tabindex="-1"
></div>
