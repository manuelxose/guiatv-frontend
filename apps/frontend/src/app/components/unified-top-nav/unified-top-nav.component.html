<header class="unified-top-nav" [class.unified-top-nav--compact]="isShrunk">
  <div class="unified-top-nav__frame">
    <div class="unified-top-nav__bar">
      <div class="unified-top-nav__leading">
        @if (showLeftRail()) {
        <button
          type="button"
          class="unified-top-nav__chrome-button"
          (click)="leftRailToggle.emit()"
          aria-label="Abrir navegación lateral"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path
              [attr.d]="iconPaths.menu"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
            ></path>
          </svg>
        </button>
        }

        <a [routerLink]="homePath" class="unified-top-nav__brand" aria-label="GUIAPROGRAMACIONTV — Inicio">
          <span class="unified-top-nav__brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none">
              <rect width="32" height="32" rx="10" fill="url(#brandGradientPortal)"></rect>
              <rect x="5" y="8" width="22" height="13" rx="3" fill="#090d16"></rect>
              <path d="M14 12v6.5c0 .5.55.8.96.53l5.4-3.25a.62.62 0 0 0 0-1.06l-5.4-3.25A.62.62 0 0 0 14 12Z" fill="white"></path>
              <defs>
                <linearGradient id="brandGradientPortal" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#ef4444"></stop>
                  <stop offset="0.55" stop-color="#f97316"></stop>
                  <stop offset="1" stop-color="#f59e0b"></stop>
                </linearGradient>
              </defs>
            </svg>
          </span>

          <span class="unified-top-nav__brand-copy">
            <strong>GUIAPROGRAMACIONTV</strong>
            <small>TV en directo, streaming, deportes y discovery editorial</small>
          </span>
        </a>
      </div>

      <div class="unified-top-nav__search">
        <app-unified-search
          [activeTab]="activeTab()"
          [query]="searchQuery()"
          [expanded]="true"
          (searchChange)="searchChange.emit($event)"
          (searchSubmit)="searchSubmit.emit($event)"
        ></app-unified-search>
      </div>

      <div class="unified-top-nav__actions">
        <a [routerLink]="appPaths.guide" class="unified-top-nav__status-pill">
          <span class="unified-top-nav__status-dot" aria-hidden="true"></span>
          <span>{{ currentStatusLabel }}</span>
        </a>

        <a
          [routerLink]="isAuthenticated() ? profilePath : loginPath"
          class="unified-top-nav__account"
          [attr.aria-label]="isAuthenticated() ? 'Abrir mi cuenta' : 'Acceder a mi cuenta'"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path
              [attr.d]="iconPaths.account"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
            ></path>
          </svg>
          <span>{{ isAuthenticated() ? profileName() : 'Acceder' }}</span>
        </a>

        @if (showRightRail()) {
        <button
          type="button"
          class="unified-top-nav__chrome-button"
          (click)="rightRailToggle.emit()"
          [attr.aria-label]="rightRailLabel()"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path
              [attr.d]="iconPaths.panel"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
            ></path>
          </svg>
        </button>
        }
      </div>

    </div>
  </div>
</header>
