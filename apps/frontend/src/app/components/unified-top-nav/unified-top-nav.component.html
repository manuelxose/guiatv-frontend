<header class="unified-top-nav" [class.unified-top-nav--compact]="isShrunk">
  <div class="unified-top-nav__frame">
    <div class="unified-top-nav__bar">
      <div class="unified-top-nav__leading">
        @if (showLeftRail()) {
        <button
          type="button"
          class="unified-top-nav__chrome-button"
          (click)="leftRailToggle.emit()"
          aria-label="Abrir navegación lateral"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path
              [attr.d]="iconPaths.menu"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
            ></path>
          </svg>
        </button>
        }

        <a [routerLink]="homePath" class="unified-top-nav__brand" aria-label="Guía TV — Inicio">
          <span class="unified-top-nav__brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none">
              <rect width="32" height="32" rx="10" fill="url(#brandGradientPortal)"></rect>
              <rect x="5" y="8" width="22" height="13" rx="3" fill="#090d16"></rect>
              <path d="M14 12v6.5c0 .5.55.8.96.53l5.4-3.25a.62.62 0 0 0 0-1.06l-5.4-3.25A.62.62 0 0 0 14 12Z" fill="white"></path>
              <defs>
                <linearGradient id="brandGradientPortal" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#ef4444"></stop>
                  <stop offset="0.55" stop-color="#f97316"></stop>
                  <stop offset="1" stop-color="#f59e0b"></stop>
                </linearGradient>
              </defs>
            </svg>
          </span>

          <span class="unified-top-nav__brand-copy">
            <strong>
              <span class="unified-top-nav__brand-full">GUÍA TV</span>
            </strong>
            <small>TV en directo, streaming, deportes y discovery editorial</small>
          </span>
        </a>
      </div>

      <nav class="unified-top-nav__tabs" aria-label="Secciones principales">
        <a
          *ngFor="let tab of tabs; trackBy: trackByTab"
          [routerLink]="tab.path"
          class="unified-top-nav__tab"
          [class.unified-top-nav__tab--active]="activeTab() === tab.id"
          [attr.aria-current]="activeTab() === tab.id ? 'page' : null"
        >
          <span class="unified-top-nav__tab-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path [attr.d]="tab.iconPath" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
            </svg>
          </span>
          <span class="unified-top-nav__tab-copy"><strong>{{ tab.label }}</strong></span>
        </a>
      </nav>

      <div class="unified-top-nav__search">
        <app-unified-search
          [activeTab]="activeTab()"
          [query]="searchQuery()"
          [expanded]="true"
          (searchChange)="searchChange.emit($event)"
          (searchSubmit)="searchSubmit.emit($event)"
        ></app-unified-search>
      </div>

      <div class="unified-top-nav__actions">
        <button
          type="button"
          class="unified-top-nav__chrome-button unified-top-nav__theme"
          (click)="cycleTheme()"
          [attr.aria-label]="themeLabel"
          [attr.title]="themeLabel"
        >
          @switch (theme.mode()) {
            @case ('dark') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                <circle cx="12" cy="12" r="4.2" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></circle>
                <path d="M12 2.5v2M12 19.5v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2.5 12h2M19.5 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
              </svg>
            }
            @case ('light') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79Z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
              </svg>
            }
            @default {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                <rect x="3.5" y="4.5" width="17" height="12" rx="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></rect>
                <path d="M12 16.5V20M8.5 20h7" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
              </svg>
            }
          }
        </button>

        @if (isAuthenticated()) {
        <app-notification-bell></app-notification-bell>
        }

        <a
          [routerLink]="isAuthenticated() ? profilePath : loginPath"
          class="unified-top-nav__account"
          [attr.aria-label]="isAuthenticated() ? 'Abrir mi cuenta' : 'Acceder a mi cuenta'"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path
              [attr.d]="iconPaths.account"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
            ></path>
          </svg>
          <span>{{ isAuthenticated() ? profileName() : 'Acceder' }}</span>
        </a>

        @if (showRightRail()) {
        <button
          type="button"
          class="unified-top-nav__chrome-button"
          (click)="rightRailToggle.emit()"
          [attr.aria-label]="rightRailLabel()"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path
              [attr.d]="iconPaths.panel"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
            ></path>
          </svg>
        </button>
        }
      </div>

    </div>
  </div>
</header>
