<!-- nav-bar.component.html - Navegación con botones rápidos -->
<header class="sticky top-0 z-50 hidden md:block">
  <nav
    class="bg-gradient-to-r from-gray-900 via-gray-800 to-gray-900 backdrop-blur-md border-b border-gray-700/50 shadow-2xl shadow-black/30"
  >
    <div class="max-w-full mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 gap-4">
        
        <!-- Logo (Mobile only) -->
        <a routerLink="/" class="flex items-center gap-3 flex-shrink-0 group md:hidden" (click)="navigateTo('/', 'home')">
          <svg
            class="h-8 w-8 fill-red-500 group-hover:fill-red-400 transition-colors"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
          >
            <path
              d="M10 15.5v-7c0-.41.47-.65.8-.4l4.67 3.5c.27.2.27.6 0 .8l-4.67 3.5c-.33.25-.8.01-.8-.4Zm11.96-4.45c.58 6.26-4.64 11.48-10.9 10.9 -4.43-.41-8.12-3.85-8.9-8.23 -.26-1.42-.19-2.78.12-4.04 .14-.58.76-.9 1.31-.7v0c.47.17.75.67.63 1.16 -.2.82-.27 1.7-.19 2.61 .37 4.04 3.89 7.25 7.95 7.26 4.79.01 8.61-4.21 7.94-9.12 -.51-3.7-3.66-6.62-7.39-6.86 -.83-.06-1.63.02-2.38.2 -.49.11-.99-.16-1.16-.64v0c-.2-.56.12-1.17.69-1.31 1.79-.43 3.75-.41 5.78.37 3.56 1.35 6.15 4.62 6.5 8.4ZM5.5 4C4.67 4 4 4.67 4 5.5 4 6.33 4.67 7 5.5 7 6.33 7 7 6.33 7 5.5 7 4.67 6.33 4 5.5 4Z"
            ></path>
          </svg>
          <span class="flex items-baseline">
            <span class="text-white font-extrabold text-xl tracking-tight">GPTV</span>
            <span class="text-red-500 font-extrabold text-xl">.</span>
          </span>
        </a>

        <!-- Quick Links (Desktop) -->
        <div class="hidden md:flex items-center gap-2">
          <button
            (click)="navigateTo('/programacion-tv/peliculas', 'peliculas')"
            class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold transition-all border cursor-pointer"
            [ngClass]="isPeliculas ? 'bg-purple-500/20 text-purple-300 border-purple-500/50' : 'bg-gray-800/60 text-gray-300 border-gray-700/60 hover:bg-purple-500/10 hover:border-purple-500/30 hover:text-purple-300'"
          >
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z" />
            </svg>
            Películas
          </button>
          <button
            (click)="navigateTo('/programacion-tv/series', 'series')"
            class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold transition-all border cursor-pointer"
            [ngClass]="isSeries ? 'bg-green-500/20 text-green-300 border-green-500/50' : 'bg-gray-800/60 text-gray-300 border-gray-700/60 hover:bg-green-500/10 hover:border-green-500/30 hover:text-green-300'"
          >
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
            </svg>
            Series
          </button>
        </div>

        <!-- Search Bar (Desktop/Tablet) -->
        <div class="hidden md:block flex-1 max-w-2xl mx-4">
          <app-autocomplete></app-autocomplete>
        </div>

        <!-- Right Actions -->
        <div class="flex items-center gap-2 lg:gap-3">
          <!-- User Account (Desktop) -->
          <button
            *ngIf="isAuthenticated$ | async"
            (click)="navigateTo('/mi-cuenta', 'mi-cuenta')"
            class="hidden md:flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-semibold transition-all border border-gray-700/60 hover:border-red-500/60 hover:bg-red-500/10 cursor-pointer"
            [ngClass]="{
              'text-white border-red-500/70 bg-red-500/15': isCuenta,
              'text-gray-200 bg-white/5': !isCuenta
            }"
          >
            <div
              class="h-7 w-7 rounded-full bg-gradient-to-br from-red-500/50 to-red-700/50 flex items-center justify-center text-xs font-bold">
              👤
            </div>
            <span class="hidden lg:inline">Mi Cuenta</span>
          </button>

          <!-- Register Button (Desktop) -->
          <button
            *ngIf="!(isAuthenticated$ | async)"
            (click)="navigateTo('/registro', 'registro')"
            class="hidden md:inline-flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold transition-all border border-gray-700/60 text-gray-200 hover:border-red-500/60 hover:text-white hover:bg-red-500/10"
          >
            Crear cuenta
          </button>

          <!-- Login Button (Desktop) -->
          <button
            *ngIf="!(isAuthenticated$ | async)"
            (click)="navigateTo('/iniciar-sesion', 'iniciar-sesion')"
            class="hidden md:inline-flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold transition-all bg-red-600 hover:bg-red-700 text-white shadow-lg shadow-red-900/30 cursor-pointer"
          >
            Acceder
          </button>

          <!-- Mobile Menu Button -->
          <button
            class="md:hidden p-2 rounded-lg text-gray-300 hover:text-white hover:bg-gray-700/50 focus:outline-none focus:ring-2 focus:ring-red-500/50 transition-colors"
            (click)="$any(menuState).toggleMobile()"
            aria-label="Abrir menú"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"
              ></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Mobile Search (below header) -->
      <div class="md:hidden pb-4">
        <app-autocomplete></app-autocomplete>
      </div>
    </div>
  </nav>

  <!-- Mobile Drawer -->
  <aside
    *ngIf="menuState.getMobile() | async"
    class="fixed inset-0 z-50 md:hidden"
    (click)="$any(menuState).toggleMobile()"
  >
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" aria-hidden="true"></div>

    <div
      class="absolute right-0 top-0 h-full w-11/12 max-w-xs bg-gradient-to-b from-gray-900 to-gray-800 shadow-2xl"
      (click)="$event.stopPropagation()"
    >
      <div class="flex items-center justify-between p-6 border-b border-gray-700/50">
        <div class="flex items-center gap-3">
          <svg
            class="h-8 w-8 fill-red-500"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
          >
            <path
              d="M10 15.5v-7c0-.41.47-.65.8-.4l4.67 3.5c.27.2.27.6 0 .8l-4.67 3.5c-.33.25-.8.01-.8-.4Zm11.96-4.45c.58 6.26-4.64 11.48-10.9 10.9 -4.43-.41-8.12-3.85-8.9-8.23 -.26-1.42-.19-2.78.12-4.04 .14-.58.76-.9 1.31-.7v0c.47.17.75.67.63 1.16 -.2.82-.27 1.7-.19 2.61 .37 4.04 3.89 7.25 7.95 7.26 4.79.01 8.61-4.21 7.94-9.12 -.51-3.7-3.66-6.62-7.39-6.86 -.83-.06-1.63.02-2.38.2 -.49.11-.99-.16-1.16-.64v0c-.2-.56.12-1.17.69-1.31 1.79-.43 3.75-.41 5.78.37 3.56 1.35 6.15 4.62 6.5 8.4ZM5.5 4C4.67 4 4 4.67 4 5.5 4 6.33 4.67 7 5.5 7 6.33 7 7 6.33 7 5.5 7 4.67 6.33 4 5.5 4Z"
            ></path>
          </svg>
          <span class="text-white font-bold text-lg">GPTV<span class="text-red-500">.</span></span>
        </div>

        <button
          (click)="$any(menuState).toggleMobile()"
          class="p-2 rounded-lg hover:bg-gray-700/50 focus:outline-none"
          aria-label="Cerrar menú"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6 text-white"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>

      <div class="overflow-auto h-[calc(100vh-88px)] p-4">
        <app-menu (click)="$event.stopPropagation()"></app-menu>
      </div>
    </div>
  </aside>
</header>
