<header class="sticky top-0 z-50 hidden md:block">
  <nav class="border-b border-slate-800/70 bg-slate-950/90 backdrop-blur-xl shadow-[0_18px_48px_rgba(0,0,0,0.25)]">
    <div class="mx-auto flex h-16 max-w-[1500px] items-center gap-4 px-4 sm:px-6 lg:px-8">
      <a routerLink="/" class="flex flex-shrink-0 items-center gap-2 text-white">
        <span class="text-lg font-black tracking-tight">GUIA</span>
        <span class="h-2 w-2 rounded-full bg-red-500"></span>
        <span class="text-lg font-black tracking-tight">TV</span>
      </a>

      <div class="hidden items-center gap-2 lg:flex">
        <button
          *ngFor="let route of headerRoutes"
          type="button"
          (click)="navigateTo(route)"
          class="min-h-[40px] rounded-full px-4 text-sm font-semibold transition-colors"
          [ngClass]="isActive(route)
            ? 'bg-red-600 text-white'
            : 'border border-slate-800 bg-slate-900/80 text-slate-300 hover:text-white hover:border-slate-700'"
        >
          {{ route.label }}
        </button>
      </div>

      <div class="mx-auto hidden w-full max-w-2xl md:block">
        <app-autocomplete></app-autocomplete>
      </div>

      <div class="ml-auto flex items-center gap-3">
        <a
          *ngIf="isAuthenticated$ | async; else authActions"
          [routerLink]="appPaths.account"
          class="inline-flex min-h-[42px] items-center rounded-full border border-slate-700 bg-slate-900/80 px-4 text-sm font-semibold text-slate-100 transition-colors hover:border-slate-500"
        >
          Mi cuenta
        </a>

        <ng-template #authActions>
          <a
            [routerLink]="appPaths.register"
            class="inline-flex min-h-[42px] items-center rounded-full border border-slate-700 px-4 text-sm font-semibold text-slate-200 transition-colors hover:border-slate-500 hover:text-white"
          >
            Crear cuenta
          </a>
          <a
            [routerLink]="appPaths.login"
            class="inline-flex min-h-[42px] items-center rounded-full bg-red-600 px-4 text-sm font-semibold text-white transition-colors hover:bg-red-500"
          >
            Acceder
          </a>
        </ng-template>
      </div>
    </div>

    <div class="border-t border-slate-800/70 px-4 py-3 md:hidden">
      <app-autocomplete></app-autocomplete>
    </div>
  </nav>
</header>
