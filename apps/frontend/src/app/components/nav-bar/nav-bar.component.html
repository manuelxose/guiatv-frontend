<header class="sticky top-0 z-[70] hidden md:block">
  <nav class="border-b border-slate-800/70 bg-slate-950/92 backdrop-blur-xl shadow-[0_14px_40px_rgba(0,0,0,0.28)]">
    <div class="mx-auto flex h-[72px] max-w-[1540px] items-center gap-5 px-6 xl:px-8">
      <a
        [routerLink]="appPaths.home"
        class="flex flex-shrink-0 items-center gap-2 text-white"
        aria-label="Inicio"
      >
        <span class="text-xl font-black tracking-tight">GUIA</span>
        <span class="h-2 w-2 rounded-full bg-red-500"></span>
        <span class="text-xl font-black tracking-tight">TV</span>
      </a>

      <div class="hidden items-center gap-2 lg:flex">
        <button
          *ngFor="let route of headerRoutes"
          type="button"
          (click)="navigateTo(route)"
          class="min-h-[44px] rounded-full px-4 text-sm font-semibold transition-colors"
          [ngClass]="isPrimaryRouteActive(route)
            ? 'bg-red-600 text-white'
            : 'border border-slate-800 bg-slate-900/80 text-slate-300 hover:border-slate-700 hover:text-white'"
        >
          {{ route.label }}
        </button>
      </div>

      <div class="ml-auto flex items-center gap-2">
        <button
          type="button"
          (click)="navigateTo(secondaryRoutes[0])"
          class="inline-flex min-h-[42px] items-center rounded-full border border-emerald-500/30 bg-emerald-500/10 px-4 text-sm font-semibold text-emerald-200 transition-colors hover:border-emerald-400/40"
          [ngClass]="isSecondaryRouteActive(secondaryRoutes[0]) ? '!bg-emerald-500/20' : ''"
        >
          En directo
        </button>

        <div class="relative">
          <button
            type="button"
            (click)="toggleMoreMenu()"
            class="inline-flex min-h-[42px] items-center gap-2 rounded-full border border-slate-800 bg-slate-900/80 px-4 text-sm font-semibold text-slate-200 transition-colors hover:border-slate-700 hover:text-white"
          >
            Más
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"></path>
            </svg>
          </button>

          <div
            *ngIf="isMoreMenuOpen"
            class="absolute right-0 top-[calc(100%+0.6rem)] z-[90] w-[24rem] overflow-hidden rounded-3xl border border-slate-800 bg-slate-950/98 p-2 shadow-[0_20px_50px_rgba(0,0,0,0.55)]"
          >
            <div class="space-y-2">
              <section *ngIf="secondaryRoutes.length > 1" class="rounded-2xl border border-slate-900/70 bg-slate-950/60 p-2">
                <p class="px-2 py-1 text-[10px] font-semibold uppercase tracking-[0.24em] text-slate-500">Explorar</p>
                <button
                  *ngFor="let route of secondaryRoutes.slice(1)"
                  type="button"
                  (click)="navigateTo(route)"
                  class="flex w-full items-center justify-between rounded-2xl px-4 py-3 text-left text-sm font-semibold transition-colors"
                  [ngClass]="isSecondaryRouteActive(route)
                    ? 'bg-slate-100 text-slate-900'
                    : 'text-slate-200 hover:bg-slate-900 hover:text-white'"
                >
                  <span>{{ route.label }}</span>
                  <span class="text-[10px] uppercase tracking-[0.25em] text-slate-500">
                    {{ getRouteAccent(route) }}
                  </span>
                </button>
              </section>

              <section *ngIf="resourceRoutes.length" class="rounded-2xl border border-slate-900/70 bg-slate-950/60 p-2">
                <p class="px-2 py-1 text-[10px] font-semibold uppercase tracking-[0.24em] text-slate-500">Recursos</p>
                <button
                  *ngFor="let route of resourceRoutes"
                  type="button"
                  (click)="navigateTo(route)"
                  class="flex w-full items-center justify-between rounded-2xl px-4 py-3 text-left text-sm font-semibold transition-colors"
                  [ngClass]="isSecondaryRouteActive(route)
                    ? 'bg-slate-100 text-slate-900'
                    : 'text-slate-200 hover:bg-slate-900 hover:text-white'"
                >
                  <span>{{ route.label }}</span>
                  <span class="text-[10px] uppercase tracking-[0.25em] text-slate-500">
                    {{ getRouteAccent(route) }}
                  </span>
                </button>
              </section>

              <section *ngIf="toolRoutes.length" class="rounded-2xl border border-slate-900/70 bg-slate-950/60 p-2">
                <p class="px-2 py-1 text-[10px] font-semibold uppercase tracking-[0.24em] text-slate-500">Herramientas</p>
                <button
                  *ngFor="let route of toolRoutes"
                  type="button"
                  (click)="navigateTo(route)"
                  class="flex w-full items-center justify-between rounded-2xl px-4 py-3 text-left text-sm font-semibold transition-colors"
                  [ngClass]="isSecondaryRouteActive(route)
                    ? 'bg-slate-100 text-slate-900'
                    : 'text-slate-200 hover:bg-slate-900 hover:text-white'"
                >
                  <span>{{ route.label }}</span>
                  <span class="text-[10px] uppercase tracking-[0.25em] text-slate-500">
                    {{ getRouteAccent(route) }}
                  </span>
                </button>
              </section>
            </div>
          </div>
        </div>

        <button
          type="button"
          (click)="openSearch()"
          class="inline-flex min-h-[42px] items-center gap-2 rounded-full border border-slate-800 bg-slate-900/80 px-4 text-sm font-semibold text-slate-200 transition-colors hover:border-slate-700 hover:text-white"
          aria-label="Buscar"
        >
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5"></circle>
            <path stroke-linecap="round" d="M16 16l4.5 4.5"></path>
          </svg>
          Buscar
        </button>

        <button
          *ngIf="isAuthenticated$ | async"
          type="button"
          (click)="openCommunity()"
          class="relative inline-flex min-h-[42px] items-center gap-2 rounded-full border border-slate-800 bg-slate-900/80 px-4 text-sm font-semibold text-slate-200 transition-colors hover:border-slate-700 hover:text-white"
          [ngClass]="activeKey === 'comunidad' ? '!border-red-500/40 !bg-red-500/10 !text-red-100' : ''"
        >
          Comunidad
          <span
            *ngIf="(unreadCount$ | async) as count"
            class="inline-flex min-w-[18px] items-center justify-center rounded-full bg-red-500 px-1.5 py-0.5 text-[10px] font-bold text-white"
          >
            {{ formatUnreadCount(count) }}
          </span>
        </button>

        <app-notification-bell *ngIf="isAuthenticated$ | async"></app-notification-bell>

        <ng-container *ngIf="isAuthenticated$ | async; else authActions">
          <a
            [routerLink]="appPaths.account"
            class="inline-flex min-h-[44px] items-center gap-3 rounded-full border border-slate-800 bg-slate-900/80 px-3 pr-4 text-sm font-semibold text-slate-100 transition-colors hover:border-slate-700"
          >
            <ng-container *ngIf="profile$ | async as profile">
              <span class="flex h-9 w-9 items-center justify-center overflow-hidden rounded-full border border-slate-700 bg-slate-800 text-[11px] font-bold text-white">
                <img
                  *ngIf="profile.avatar"
                  [src]="profile.avatar"
                  class="h-full w-full object-cover"
                  alt=""
                />
                <span *ngIf="!profile.avatar">{{ getInitials(profile.name) }}</span>
              </span>
              {{ profile.name || 'Mi cuenta' }}
            </ng-container>
          </a>
        </ng-container>

        <ng-template #authActions>
          <a
            [routerLink]="appPaths.login"
            class="inline-flex min-h-[42px] items-center rounded-full border border-slate-700 px-4 text-sm font-semibold text-slate-200 transition-colors hover:border-slate-500 hover:text-white"
          >
            Acceder
          </a>
          <a
            [routerLink]="appPaths.register"
            class="inline-flex min-h-[42px] items-center rounded-full bg-red-600 px-4 text-sm font-semibold text-white transition-colors hover:bg-red-500"
          >
            Crear cuenta
          </a>
        </ng-template>
      </div>
    </div>
  </nav>
</header>
