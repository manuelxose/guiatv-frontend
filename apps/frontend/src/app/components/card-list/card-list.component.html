<div
  class="card-list group relative flex w-full cursor-pointer flex-col overflow-hidden rounded-xl bg-gray-900 shadow-lg transition-all duration-300 hover:shadow-2xl hover:shadow-red-500/10 h-full"
  (click)="onClick()"
  (keydown.enter)="onClick()"
  (keydown.space)="$event.preventDefault(); onClick()"
  role="button"
  tabindex="0"
  [attr.aria-label]="title"
>
  <!-- Image Section -->
  <div class="relative h-48 sm:h-56 w-full flex-shrink-0 overflow-hidden">
    <div
      class="absolute inset-0 bg-cover bg-center transition-transform duration-500 group-hover:scale-110"
      [style.background-image]="backgroundImage"
    ></div>
    <div
      class="absolute inset-0 bg-gradient-to-t from-gray-900 via-transparent to-transparent"
    ></div>

    <!-- Live Badge -->
    <div *ngIf="live" class="absolute top-3 left-3 z-10">
      <span
        class="flex items-center gap-1.5 rounded-full bg-red-600/90 px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-white shadow-sm backdrop-blur-sm"
      >
        <span class="relative flex h-2 w-2">
          <span
            class="absolute inline-flex h-full w-full animate-ping rounded-full bg-white opacity-75"
          ></span>
          <span
            class="relative inline-flex h-2 w-2 rounded-full bg-white"
          ></span>
        </span>
        En Vivo
      </span>
    </div>

    <!-- Channel Logo (Top Right) -->
    <div *ngIf="channelIcon" class="absolute top-3 right-3 z-10">
      <div class="bg-white/10 backdrop-blur-md p-1.5 rounded-lg shadow-lg">
        <img 
          [src]="channelIcon" 
          [alt]="subtitle"
          class="h-8 w-8 object-contain"
          (error)="$any($event.target).style.display='none'"
        />
      </div>
    </div>

    <!-- Category Badge -->
    <div *ngIf="category" class="absolute bottom-3 left-3 z-10">
      <span
        class="rounded-md bg-black/60 px-2 py-1 text-[10px] font-medium text-white backdrop-blur-sm"
      >
        {{ category }}
      </span>
    </div>
  </div>

  <!-- Content Section -->
  <div class="flex flex-1 flex-col justify-between p-4 min-w-0">
    <div>
      <!-- Header -->
      <div class="mb-2 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <!-- Removed small channel logo from here -->
          <span
            class="text-xs font-bold text-red-400 uppercase tracking-wide"
            *ngIf="subtitle"
          >
            {{ subtitle }}
          </span>
        </div>
        <span *ngIf="time" class="flex items-center gap-1 text-xs text-gray-400">
          <svg
            class="h-3 w-3"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
          {{ time }}
        </span>
      </div>

      <!-- Title -->
      <h3
        class="mb-2 text-base font-bold leading-tight text-white group-hover:text-red-400 transition-colors line-clamp-2"
      >
        {{ title }}
      </h3>

      <!-- Description -->
      <p class="line-clamp-3 text-xs lg:text-sm text-gray-400 leading-relaxed">
        {{ description }}
      </p>
    </div>

    <!-- Footer / Actions -->
    <div class="mt-4 flex flex-col gap-3">
      <!-- Progress Bar (if live) -->
      <div *ngIf="live" class="w-full">
        <div class="flex justify-between items-end mb-1.5">
          <span class="text-[10px] font-medium text-red-400 uppercase tracking-wider">En emision</span>
          <span class="text-[10px] text-gray-400 font-mono">{{ timeText }}</span>
        </div>
        <div class="h-1.5 w-full overflow-hidden rounded-full bg-gray-700/50">
          <div
            class="h-full bg-gradient-to-r from-red-600 to-red-500 shadow-[0_0_10px_rgba(220,38,38,0.5)] transition-all duration-1000"
            [style.width.%]="progressPercentage"
          ></div>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex items-center justify-end w-full">
        <app-interaction-buttons
          [itemId]="id"
          [title]="title"
          [type]="type"
          [compact]="deviceDetector.isMobile()"
        ></app-interaction-buttons>
      </div>
    </div>
  </div>
</div>
