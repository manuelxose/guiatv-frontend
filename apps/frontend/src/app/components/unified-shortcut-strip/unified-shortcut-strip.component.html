<nav class="shortcut-strip" aria-label="Atajos contextuales" *ngIf="items.length">
  <a
    *ngFor="let item of items; trackBy: trackByItem"
    [routerLink]="item.path"
    [queryParams]="item.queryParams"
    class="shortcut-strip__item"
  >
    <span class="shortcut-strip__icon" *ngIf="item.iconPath" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path
          [attr.d]="item.iconPath"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="1.8"
        ></path>
      </svg>
    </span>
    <span class="shortcut-strip__copy">
      <strong>{{ item.label }}</strong>
      <small *ngIf="item.description">{{ item.description }}</small>
    </span>
  </a>
</nav>
