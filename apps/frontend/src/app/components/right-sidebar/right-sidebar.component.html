<!-- right-sidebar.component.html - Premium Card Design -->
<aside class="w-72 2xl:w-80 h-full bg-gradient-to-b from-gray-900/95 via-gray-900 to-gray-950 border-l border-gray-800/50 hidden lg:flex flex-col backdrop-blur-xl">
  <!-- Header -->
  <div class="p-5 border-b border-gray-800/50">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-gradient-to-br from-red-500 to-red-600 rounded-xl flex items-center justify-center shadow-lg shadow-red-500/20">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
      </div>
      <div>
        <h2 class="text-white font-bold text-sm">Tendencias</h2>
        <p class="text-gray-500 text-xs">Lo más popular ahora</p>
      </div>
    </div>
  </div>
  
  <!-- Scrollable Content -->
  <div class="flex-1 overflow-y-auto scrollbar-thin scrollbar-thumb-gray-700 scrollbar-track-transparent">
    
    <!-- Películas Section -->
    <div class="p-4">
      <div class="flex items-center gap-2 mb-4">
        <span class="w-1 h-4 bg-red-500 rounded-full"></span>
        <h3 class="text-sm font-semibold text-gray-300 uppercase tracking-wider">Películas</h3>
      </div>

      <!-- Loading State -->
      <div *ngIf="popular_movies().length === 0 && isLoading()" class="space-y-3">
        <div *ngFor="let i of [1,2,3]" class="animate-pulse">
          <div class="flex gap-3 p-2">
            <div class="w-14 h-20 bg-gray-800 rounded-lg"></div>
            <div class="flex-1 space-y-2 py-1">
              <div class="h-3 bg-gray-800 rounded w-3/4"></div>
              <div class="h-2 bg-gray-800 rounded w-1/2"></div>
              <div class="h-2 bg-gray-800 rounded w-1/4"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Empty State -->
      <div *ngIf="popular_movies().length === 0 && !isLoading()" class="text-center py-6">
        <div class="w-12 h-12 mx-auto mb-3 bg-gray-800/50 rounded-xl flex items-center justify-center">
          <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"/>
          </svg>
        </div>
        <p class="text-gray-500 text-xs mb-3">Sin películas disponibles</p>
        <button (click)="forceReload()" class="text-xs text-red-400 hover:text-red-300">Reintentar</button>
      </div>

      <!-- Movies Grid -->
      <div *ngIf="popular_movies().length > 0" class="space-y-2">
        <div *ngFor="let movie of popular_movies(); let i = index; trackBy: trackByMovieId"
             class="group relative overflow-hidden rounded-xl cursor-pointer transition-all duration-300 hover:scale-[1.02]"
             (click)="navigateTo(movie)">
          
          <!-- Card Background with Gradient -->
          <div class="absolute inset-0 bg-gradient-to-r from-gray-800/80 via-gray-800/60 to-transparent"></div>
          
          <!-- Content -->
          <div class="relative flex items-center gap-3 p-2.5">
            <!-- Ranking Number -->
            <div class="w-6 h-6 flex-shrink-0 flex items-center justify-center">
              <span class="text-2xl font-black text-gray-700/80 group-hover:text-red-500/40 transition-colors">{{ i + 1 }}</span>
            </div>
            
            <!-- Poster -->
            <div class="relative w-12 h-16 flex-shrink-0 rounded-lg overflow-hidden shadow-lg ring-1 ring-gray-700/50 group-hover:ring-red-500/50 transition-all">
              <img [src]="getMovieImageUrl(movie)"
                   [alt]="movie.title.value"
                   class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
                   loading="lazy"
                   (error)="onImageError($event)">
              <div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
            </div>
            
            <!-- Info -->
            <div class="flex-1 min-w-0 py-1">
              <h4 class="text-white text-sm font-medium line-clamp-1 group-hover:text-red-300 transition-colors">
                {{ movie.title.value }}
              </h4>
              <p class="text-gray-500 text-xs mt-0.5">{{ getMovieCategory(movie) }}</p>
              <div class="flex items-center gap-1 mt-1.5">
                <svg class="w-3 h-3 text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
                  <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                </svg>
                <span class="text-yellow-400/80 text-xs font-medium">{{ formatRating(movie.starRating) }}</span>
              </div>
            </div>
            
            <!-- Arrow -->
            <div class="w-6 h-6 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all transform translate-x-2 group-hover:translate-x-0">
              <svg class="w-4 h-4 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
              </svg>
            </div>
          </div>
        </div>
        
        <!-- View All Button -->
        <button (click)="navigateTo2('movie')"
                class="w-full mt-3 py-2.5 text-center text-xs font-medium text-red-400 hover:text-red-300 bg-red-500/5 hover:bg-red-500/10 border border-red-500/20 hover:border-red-500/40 rounded-xl transition-all">
          Ver todas las películas →
        </button>
      </div>
    </div>

    <!-- Divider -->
    <div class="mx-4 border-t border-gray-800/50"></div>

    <!-- Series Section -->
    <div class="p-4" *ngIf="popular_series().length > 0">
      <div class="flex items-center gap-2 mb-4">
        <span class="w-1 h-4 bg-blue-500 rounded-full"></span>
        <h3 class="text-sm font-semibold text-gray-300 uppercase tracking-wider">Series</h3>
      </div>

      <!-- Series Grid -->
      <div class="space-y-2">
        <div *ngFor="let serie of popular_series(); let i = index; trackBy: trackBySerieId"
             class="group relative overflow-hidden rounded-xl cursor-pointer transition-all duration-300 hover:scale-[1.02]"
             (click)="navigateTo(serie)">
          
          <!-- Card Background -->
          <div class="absolute inset-0 bg-gradient-to-r from-gray-800/80 via-gray-800/60 to-transparent"></div>
          
          <!-- Content -->
          <div class="relative flex items-center gap-3 p-2.5">
            <!-- Ranking Number -->
            <div class="w-6 h-6 flex-shrink-0 flex items-center justify-center">
              <span class="text-2xl font-black text-gray-700/80 group-hover:text-blue-500/40 transition-colors">{{ i + 1 }}</span>
            </div>
            
            <!-- Poster -->
            <div class="relative w-12 h-16 flex-shrink-0 rounded-lg overflow-hidden shadow-lg ring-1 ring-gray-700/50 group-hover:ring-blue-500/50 transition-all">
              <img [src]="getSerieImageUrl(serie)"
                   [alt]="serie.title.value"
                   class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
                   loading="lazy"
                   (error)="onImageError($event)">
              <div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
            </div>
            
            <!-- Info -->
            <div class="flex-1 min-w-0 py-1">
              <h4 class="text-white text-sm font-medium line-clamp-1 group-hover:text-blue-300 transition-colors">
                {{ serie.title.value }}
              </h4>
              <p class="text-gray-500 text-xs mt-0.5">{{ getSerieCategory(serie) }}</p>
              <div class="flex items-center gap-1 mt-1.5">
                <svg class="w-3 h-3 text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
                  <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 10-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                </svg>
                <span class="text-yellow-400/80 text-xs font-medium">{{ formatRating(serie.starRating) }}</span>
              </div>
            </div>
            
            <!-- Arrow -->
            <div class="w-6 h-6 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all transform translate-x-2 group-hover:translate-x-0">
              <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
              </svg>
            </div>
          </div>
        </div>
        
        <!-- View All Button -->
        <button (click)="navigateTo2('series')"
                class="w-full mt-3 py-2.5 text-center text-xs font-medium text-blue-400 hover:text-blue-300 bg-blue-500/5 hover:bg-blue-500/10 border border-blue-500/20 hover:border-blue-500/40 rounded-xl transition-all">
          Ver todas las series →
        </button>
      </div>
    </div>

  </div>
  
  <!-- Footer Branding -->
  <div class="p-4 border-t border-gray-800/50">
    <div class="flex items-center justify-center gap-2 text-gray-600 text-xs">
      <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
        <path d="M10 15.5v-7c0-.41.47-.65.8-.4l4.67 3.5c.27.2.27.6 0 .8l-4.67 3.5c-.33.25-.8.01-.8-.4Z"/>
      </svg>
      <span>GPTV</span>
    </div>
  </div>
</aside>
