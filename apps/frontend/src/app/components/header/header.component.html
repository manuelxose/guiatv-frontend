<header
  *ngIf="!isViewable"
  class="font-bold text-lg flex items-center gap-x-3 md:hidden py-10 px-5 sm:px-10 z-30"
>
  <span (click)="toggleMenu()" class="mr-6 menu-toggle">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-7 w-7 text-gray-700 dark:text-white icon-interactive"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M4 6h16M4 12h16M4 18h7"
      />
    </svg>
  </span>  <div class="cursor-pointer logo-container" routerLink="/">
    <svg
      class="h-8 w-8 shrink-0 logo-icon"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 32 32"
      aria-hidden="true"
    >
      <defs>
        <linearGradient id="hdr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ef4444"/>
          <stop offset="100%" stop-color="#b91c1c"/>
        </linearGradient>
      </defs>
      <rect width="32" height="32" rx="7" fill="url(#hdr-bg)"/>
      <rect x="4" y="7" width="24" height="15" rx="2.5" fill="#0f0f1a"/>
      <rect x="5" y="8" width="22" height="13" rx="2" fill="#16172a"/>
      <path d="M13.5 11.5v9c0 .38.42.6.74.4l7.5-4.5a.47.47 0 0 0 0-.8l-7.5-4.5a.47.47 0 0 0-.74.4z" fill="white"/>
      <rect x="11" y="22" width="4" height="3" rx="1" fill="#b91c1c"/>
      <rect x="17" y="22" width="4" height="3" rx="1" fill="#b91c1c"/>
      <rect x="8.5" y="25" width="15" height="2" rx="1" fill="#991b1b"/>
    </svg>
    <div class="tracking-wide dark:text-white flex-1 logo-text">
      GUIA<span class="text-red-500">.</span>TV
    </div>
  </div>

  <app-autocomplete></app-autocomplete>
</header>

<aside *ngIf="isViewable" class="h-full absolute z-30 bg-gray-500/30 w-full mobile-menu-overlay">
  <div
    class="w-1/2 py-10 pl-10 min-w-min border-r border-gray-300 dark:border-zinc-700 md:block z-30 lg:hidden bg-white dark:bg-zinc-800 h-[100vh] mobile-menu-container"
  >
    <!-- BOTON DE CERRAR MENU CON UNA X -->
    <div class="flex justify-end">
      <span (click)="toggleMenu()" class="mr-6 close-button p-1">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-7 w-7 text-gray-700 dark:text-white icon-interactive"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </span>
    </div>

    <!-- Menu -->
    <app-menu></app-menu>
    <!-- /Menu -->
  </div>
</aside>
