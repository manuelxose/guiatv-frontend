<div *ngIf="safeLdHtml" [innerHTML]="safeLdHtml"></div>

<app-unified-portal-shell
  tone="home"
  [activeTab]="null"
  [searchQuery]="searchQuery()"
  [topPillChips]="topPillChips()"
  [topPillSelection]="topPillSelection()"
  topPillLabel="Empieza por aquí"
  [leftRailSections]="leftRailSections()"
  [rightRailSections]="rightRailSections()"
  [rightRailLabel]="rightRailLabel"
  rightRailVariant="prime"
  [isAuthenticated]="isAuthenticated()"
  [profileName]="profile()?.name || 'Cuenta'"
  [breadcrumbItems]="breadcrumbItems"
  [showHero]="loading() || !!heroLead()"
  heroVariant="stage"
  (tabChange)="navigateToTab($event)"
  (topPillChange)="onTopPillChange($event)"
  (searchChange)="onSearchChange($event)"
  (searchSubmit)="onSearchSubmit($event)"
>
  <div class="home-page__hero-live" shell-hero-media *ngIf="heroLead() as lead">
    <app-unified-program-card
      [item]="lead"
      variant="live"
      [showActions]="false"
    ></app-unified-program-card>
  </div>

  <div class="home-page__hero-loading" shell-hero-media *ngIf="loading()">
    <app-unified-skeleton-block
      [count]="1"
      [columns]="1"
      cardHeight="100%"
    ></app-unified-skeleton-block>
  </div>

  <section *ngIf="loading()" class="home-page__loading">
    <app-unified-skeleton-block [count]="6" [columns]="3" cardHeight="15rem"></app-unified-skeleton-block>
  </section>

  <section *ngIf="error()" class="home-page__error">
    <h2>Portada no disponible</h2>
    <p>{{ error() }}</p>
  </section>

  <ng-container *ngIf="!loading() && !error()">
    <section *ngIf="liveNow().length" class="home-page__module">
      <app-unified-section-header
        eyebrow="Ahora en TV"
        title="Lo que está en emisión ahora mismo"
        linkLabel="Abrir TV Directo"
        [linkPath]="appPaths.guide"
      ></app-unified-section-header>

      <div class="home-page__rail">
        <app-unified-program-card
          *ngFor="let item of liveNow()"
          [item]="item"
          variant="compact"
        ></app-unified-program-card>
      </div>
    </section>

    @defer (hydrate on viewport) {
    <section *ngIf="tonight().length" class="home-page__module">
      <app-unified-section-header
        eyebrow="Esta noche"
        title="Prime time, cine, series y deporte del tramo fuerte"
        linkLabel="Ver guía nocturna"
        [linkPath]="appPaths.guide"
        [linkQueryParams]="{ liveView: 'night' }"
      ></app-unified-section-header>

      <div class="home-page__rail">
        <app-unified-program-card
          *ngFor="let item of tonight()"
          [item]="item"
          variant="compact"
        ></app-unified-program-card>
      </div>
    </section>

    <section *ngIf="featuredPlatforms().length" class="home-page__module">
      <app-unified-section-header
        eyebrow="Plataformas destacadas"
        title="Entra al catálogo desde Netflix, Prime Video, Max o Disney+"
        linkLabel="Abrir streaming"
        [linkPath]="appPaths.platforms"
      ></app-unified-section-header>

      <div class="home-page__platform-grid">
        <a
          *ngFor="let platform of featuredPlatforms(); trackBy: trackByPlatform"
          [routerLink]="appPaths.platforms"
          [queryParams]="{ platform: platform.name }"
          class="home-page__platform-card"
        >
          <app-platform-badge
            [label]="platform.name"
            [color]="platform.color"
            [logoUrl]="platform.logoUrl || ''"
          ></app-platform-badge>
          <span>Entrar al catálogo</span>
        </a>
      </div>
    </section>

    <section *ngIf="streamingHighlights().length" class="home-page__module">
      <app-unified-section-header
        eyebrow="Streaming en foco"
        title="Catálogo visible antes que los filtros"
        linkLabel="Ver plataformas"
        [linkPath]="appPaths.platforms"
      ></app-unified-section-header>

      <div class="home-page__grid">
        <app-unified-program-card
          *ngFor="let item of streamingHighlights()"
          [item]="item"
          variant="streaming"
        ></app-unified-program-card>
      </div>
    </section>

    <section *ngIf="sportsNow().length" class="home-page__module">
      <app-unified-section-header
        eyebrow="Deportes en directo"
        title="Agenda viva y próximos eventos desde la portada"
        linkLabel="Ir a deportes"
        [linkPath]="appPaths.sports"
      ></app-unified-section-header>

      <div class="home-page__grid home-page__grid--sports">
        <app-unified-program-card
          *ngFor="let item of sportsNow()"
          [item]="item"
          variant="sport"
        ></app-unified-program-card>
      </div>
    </section>

    <app-unified-editorial-module
      *ngIf="editorialGuides().length"
      eyebrow="Desde editorial"
      title="Guías y contexto conectados con la exploración"
      linkLabel="Abrir editorial"
      [linkPath]="appPaths.blog"
      [posts]="editorialGuides()"
      [columns]="3"
    ></app-unified-editorial-module>

    <app-unified-editorial-module
      *ngIf="rankingHighlights().length"
      eyebrow="Top rankings"
      title="Selecciones editoriales para decidir rápido"
      linkLabel="Ver rankings"
      [linkPath]="appPaths.top10"
      [posts]="rankingHighlights()"
      [columns]="4"
    ></app-unified-editorial-module>

    <section *ngIf="trendingItems().length" class="home-page__module">
      <app-unified-section-header
        eyebrow="Tendencias"
        title="Lo más movido del catálogo ahora"
        linkLabel="Ver tendencias"
        [linkPath]="appPaths.stats"
      ></app-unified-section-header>

      <div class="home-page__grid">
        <app-unified-program-card
          *ngFor="let item of trendingItems()"
          [item]="item"
          variant="discover"
        ></app-unified-program-card>
      </div>
    </section>
    }
  </ng-container>
</app-unified-portal-shell>
