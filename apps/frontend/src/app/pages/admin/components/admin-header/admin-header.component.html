<header class="sticky top-0 z-30 border-b border-[var(--portal-border)] bg-[var(--portal-surface)] backdrop-blur-xl">
  <div class="px-5 sm:px-6 lg:px-8 py-4">
    <div class="flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-start gap-3">
        <button
          class="lg:hidden h-10 w-10 rounded-xl bg-[var(--portal-surface)] border border-[var(--portal-border)] text-[var(--portal-text)] flex items-center justify-center focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-500"
          (click)="onToggleSidebar()"
          type="button"
          aria-label="Open navigation"
        >
          <span class="text-lg">=</span>
        </button>
        <div class="space-y-1">
          <nav class="flex items-center gap-2 text-xs text-[var(--portal-text-muted)]" aria-label="Breadcrumb">
            <span>GPTV Admin</span>
            <span aria-hidden="true">/</span>
            <span>{{ activeGroupLabel }}</span>
            <span aria-hidden="true">/</span>
            <span class="text-[var(--portal-text)]">{{ activeItemLabel }}</span>
          </nav>
          <div class="flex items-center gap-2">
            <h2 class="text-lg font-semibold text-[var(--portal-text)]">{{ activeItemLabel }}</h2>
            <span class="text-[10px] uppercase tracking-[0.25em] text-[var(--portal-text-soft)]">Live</span>
          </div>
          <p *ngIf="activeItemDescription" class="text-xs text-[var(--portal-text-soft)]">
            {{ activeItemDescription }}
          </p>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-3 w-full lg:w-auto">
        <div class="flex flex-wrap items-center gap-2 text-xs text-[var(--portal-text-soft)]">
          <div class="flex items-center gap-2 rounded-full border border-emerald-500/30 bg-emerald-500/10 px-3 py-1">
            <span class="h-2 w-2 rounded-full bg-emerald-400"></span>
            <span>System healthy</span>
          </div>
          <div *ngIf="lastUpdated" class="text-[var(--portal-text-muted)]">Updated {{ lastUpdated | date: 'shortTime' }}</div>
        </div>

        <div class="hidden xl:flex items-center gap-2">
          <button
            class="px-3 py-2 rounded-xl bg-red-500/20 border border-red-500/40 text-xs text-red-100 hover:bg-red-500/30 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-500"
            type="button"
          >
            New entry
          </button>
          <button
            class="px-3 py-2 rounded-xl border border-[var(--portal-border-strong)] text-xs text-[var(--portal-text)] hover:text-[var(--portal-text)] hover:border-[var(--portal-border-strong)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-500"
            type="button"
          >
            Export
          </button>
          <button
            class="px-3 py-2 rounded-xl border border-[var(--portal-border-strong)] text-xs text-[var(--portal-text)] hover:text-[var(--portal-text)] hover:border-[var(--portal-border-strong)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-500"
            type="button"
          >
            Run sync
          </button>
        </div>

        <div class="relative flex-1 lg:flex-none">
          <label for="admin-search" class="sr-only">Search admin</label>
          <input
            id="admin-search"
            type="text"
            placeholder="Search admin"
            class="w-full lg:w-64 bg-[var(--portal-surface)] border border-[var(--portal-border)] rounded-xl px-4 py-2 text-sm text-[var(--portal-text)] placeholder:text-[var(--portal-text-muted)] focus:outline-none focus-visible:ring-2 focus-visible:ring-red-500"
          />
        </div>

        <div class="hidden lg:flex items-center gap-2 text-xs text-[var(--portal-text-muted)]">
          <span>Density</span>
          <div class="flex items-center rounded-full border border-[var(--portal-border)] bg-[var(--portal-surface)] p-1">
            <button
              class="px-2 py-1 rounded-full text-[11px] text-[var(--portal-text)] bg-[var(--portal-border-strong)]"
              type="button"
              aria-pressed="true"
            >
              Comfort
            </button>
            <button
              class="px-2 py-1 rounded-full text-[11px] text-[var(--portal-text-soft)] hover:text-[var(--portal-text)]"
              type="button"
              aria-pressed="false"
            >
              Compact
            </button>
          </div>
        </div>

        <a
          [routerLink]="['/']"
          class="px-3 py-2 rounded-xl border border-[var(--portal-border-strong)] text-xs text-[var(--portal-text-soft)] hover:text-[var(--portal-text)] hover:border-[var(--portal-border-strong)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-500"
        >
          Back to app
        </a>
      </div>
    </div>
  </div>
</header>
