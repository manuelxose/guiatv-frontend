<aside
  class="fixed inset-y-0 left-0 z-40 w-72 bg-[var(--portal-surface)] border-r border-[var(--portal-border)] backdrop-blur-xl transform transition-transform duration-300 lg:translate-x-0"
  [class.translate-x-0]="sidebarOpen"
  [class.-translate-x-full]="!sidebarOpen"
>
  <div class="px-6 py-6 border-b border-[var(--portal-border)]">
    <div class="flex items-center justify-between">
      <div>
        <p class="text-[10px] text-[var(--portal-text-muted)] uppercase tracking-[0.3em]">Control Center</p>
        <h1 class="text-xl font-semibold text-[var(--portal-text)]">GPTV Admin</h1>
        <p class="text-xs text-[var(--portal-text-muted)] mt-1">Editorial + Data Ops</p>
      </div>
      <span
        class="text-[10px] px-2 py-1 rounded-full border"
        [ngClass]="environmentLabel === 'Production' ? 'border-red-400/40 text-red-300 bg-red-500/10' : 'border-emerald-400/40 text-emerald-300 bg-emerald-500/10'"
      >
        {{ environmentLabel }}
      </span>
    </div>

    <div class="mt-4 grid grid-cols-2 gap-2 text-xs text-[var(--portal-text-soft)]">
      <div class="rounded-xl border border-[var(--portal-border)] bg-[var(--portal-surface)] px-3 py-2">
        <p class="text-[10px] uppercase tracking-[0.2em] text-[var(--portal-text-muted)]">Traffic</p>
        <p class="text-sm font-semibold text-[var(--portal-text)]">+6.2%</p>
      </div>
      <div class="rounded-xl border border-[var(--portal-border)] bg-[var(--portal-surface)] px-3 py-2">
        <p class="text-[10px] uppercase tracking-[0.2em] text-[var(--portal-text-muted)]">Errors</p>
        <p class="text-sm font-semibold text-[var(--portal-text)]">2 open</p>
      </div>
    </div>
  </div>

  <div class="px-4 py-6 space-y-6 overflow-y-auto h-[calc(100vh-168px)]">
    <nav aria-label="Primary" class="space-y-6">
      <div
        *ngFor="let group of navGroups; let i = index"
        class="space-y-2"
        [ngClass]="{ 'pt-4 border-t border-[var(--portal-border)]': i > 0 }"
      >
        <div
          class="flex items-center gap-3 px-3 text-[10px] uppercase tracking-[0.25em]"
          [ngClass]="group.id === activeGroup ? 'text-red-300' : 'text-[var(--portal-text-muted)]'"
        >
          <span class="h-7 w-7 rounded-lg flex items-center justify-center text-[10px] border border-[var(--portal-border)] bg-[var(--portal-surface)] text-[var(--portal-text-soft)]">
            {{ group.icon }}
          </span>
          <span>{{ group.label }}</span>
        </div>
        <div class="space-y-1">
          <button
            *ngFor="let item of group.items"
            type="button"
            class="w-full flex items-center justify-between gap-3 px-3 py-2 rounded-xl text-sm border-l-2 transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-500"
            [ngClass]="isActive(group.id, item.id) ? 'bg-[var(--portal-surface)] text-[var(--portal-text)] border-red-500' : 'text-[var(--portal-text-soft)] border-transparent hover:text-[var(--portal-text)] hover:bg-[var(--portal-surface-strong)]'"
            (click)="selectSection(group.id, item.id)"
            [attr.title]="item.description || null"
            [attr.aria-current]="isActive(group.id, item.id) ? 'page' : null"
          >
            <span class="flex flex-col items-start">
              <span class="font-medium">{{ item.label }}</span>
              <span *ngIf="item.description" class="text-[10px] text-[var(--portal-text-muted)]">
                {{ item.description }}
              </span>
            </span>
            <span *ngIf="item.badge" class="text-[10px] text-[var(--portal-text-soft)] border border-[var(--portal-border-strong)] px-2 py-0.5 rounded-full">
              {{ item.badge }}
            </span>
            <span *ngIf="isActive(group.id, item.id)" class="sr-only">Active</span>
          </button>
        </div>
      </div>
    </nav>

    <div class="pt-4 border-t border-[var(--portal-border)]">
      <a
        [routerLink]="['/']"
        class="w-full inline-flex items-center justify-center px-3 py-2 rounded-xl border border-[var(--portal-border-strong)] text-xs text-[var(--portal-text-soft)] hover:text-[var(--portal-text)] hover:border-[var(--portal-border-strong)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-500"
      >
        Back to app
      </a>
    </div>
  </div>
</aside>
