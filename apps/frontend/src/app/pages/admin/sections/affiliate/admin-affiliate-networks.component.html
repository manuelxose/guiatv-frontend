<div class="grid lg:grid-cols-[minmax(0,1fr)_minmax(0,1.2fr)] gap-6">
  <form
    class="bg-[var(--portal-surface)] border border-[var(--portal-border)] rounded-2xl p-6 space-y-5 h-fit"
    [formGroup]="form"
    (ngSubmit)="submit()"
  >
    <div class="flex items-center justify-between gap-4">
      <h4 class="text-lg font-semibold text-[var(--portal-text)]">{{ isEditing ? 'Editar red' : 'Nueva red' }}</h4>
      <span *ngIf="saving" class="text-xs text-[var(--portal-text-soft)]">Guardando...</span>
    </div>

    <div *ngIf="saveError" class="bg-red-500/10 border border-red-500/30 text-red-200 px-4 py-3 rounded-xl text-sm">{{ saveError }}</div>
    <div *ngIf="saveSuccess" class="bg-emerald-500/10 border border-emerald-500/30 text-emerald-200 px-4 py-3 rounded-xl text-sm">{{ saveSuccess }}</div>

    <div>
      <label class="text-xs text-[var(--portal-text-soft)] uppercase tracking-wider" for="network-name">Nombre</label>
      <input id="network-name" formControlName="name" type="text"
        class="mt-2 w-full bg-[var(--portal-surface)] border border-[var(--portal-border)] rounded-xl px-4 py-2 text-sm text-[var(--portal-text)] focus:outline-none focus-visible:ring-2 focus-visible:ring-red-500"
        placeholder="AWIN" />
    </div>

    <div>
      <label class="text-xs text-[var(--portal-text-soft)] uppercase tracking-wider" for="network-tracking">Tipo de tracking</label>
      <select id="network-tracking" formControlName="trackingType"
        class="mt-2 w-full bg-[var(--portal-surface)] border border-[var(--portal-border)] rounded-xl px-3 py-2 text-sm text-[var(--portal-text)] focus:outline-none focus-visible:ring-2 focus-visible:ring-red-500">
        <option *ngFor="let option of trackingTypeOptions" [value]="option.id">{{ option.label }}</option>
      </select>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="text-xs text-[var(--portal-text-soft)] uppercase tracking-wider" for="network-markets">Mercados</label>
        <input id="network-markets" formControlName="markets" type="text"
          class="mt-2 w-full bg-[var(--portal-surface)] border border-[var(--portal-border)] rounded-xl px-4 py-2 text-sm text-[var(--portal-text)] focus:outline-none focus-visible:ring-2 focus-visible:ring-red-500"
          placeholder="ES, PT" />
      </div>
      <div>
        <label class="text-xs text-[var(--portal-text-soft)] uppercase tracking-wider" for="network-status">Estado</label>
        <select id="network-status" formControlName="status"
          class="mt-2 w-full bg-[var(--portal-surface)] border border-[var(--portal-border)] rounded-xl px-3 py-2 text-sm text-[var(--portal-text)] focus:outline-none focus-visible:ring-2 focus-visible:ring-red-500">
          <option value="active">Activa</option>
          <option value="paused">Pausada</option>
          <option value="inactive">Inactiva</option>
        </select>
      </div>
    </div>

    <div class="flex flex-wrap items-center justify-end gap-3 pt-2">
      <button type="button"
        class="px-4 py-2 rounded-xl border border-[var(--portal-border-strong)] text-[var(--portal-text)] text-sm hover:border-[var(--portal-border-strong)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-500"
        (click)="resetForm()">
        Limpiar
      </button>
      <button type="submit"
        class="px-5 py-2 rounded-xl bg-red-500/20 border border-red-500/40 text-red-100 text-sm hover:bg-red-500/30 disabled:opacity-50 disabled:cursor-not-allowed focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-500"
        [disabled]="saving || form.invalid">
        {{ isEditing ? 'Actualizar red' : 'Crear red' }}
      </button>
    </div>
  </form>

  <div class="bg-[var(--portal-surface)] border border-[var(--portal-border)] rounded-2xl p-6">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
      <div>
        <h4 class="text-lg font-semibold text-[var(--portal-text)]">Redes de afiliación</h4>
        <p class="text-xs text-[var(--portal-text-muted)]">{{ networks.length }} resultados</p>
      </div>
      <button type="button"
        class="px-3 py-2 rounded-xl border border-[var(--portal-border-strong)] text-xs text-[var(--portal-text)] hover:border-[var(--portal-border-strong)]"
        (click)="refresh()">
        Refrescar
      </button>
    </div>

    <div *ngIf="loading" class="text-sm text-[var(--portal-text-muted)] py-6 text-center">Cargando redes...</div>
    <div *ngIf="error" class="text-sm text-red-300 py-3">{{ error }}</div>
    <div *ngIf="!loading && !error && networks.length === 0" class="text-sm text-[var(--portal-text-muted)] py-6 text-center">
      No hay redes de afiliación configuradas.
    </div>

    <div *ngIf="networks.length" class="space-y-3 max-h-[720px] overflow-auto pr-1">
      <article *ngFor="let network of networks; trackBy: trackById"
        class="p-4 rounded-2xl bg-[var(--portal-surface)] border space-y-3"
        [ngClass]="selectedId === network.id ? 'border-red-500/40' : 'border-[var(--portal-border)]'">
        <div class="flex items-start justify-between gap-3">
          <h5 class="text-[var(--portal-text)] text-sm font-semibold">{{ network.name }}</h5>
          <span class="text-[10px] px-2 py-1 rounded-full border flex-shrink-0"
            [ngClass]="network.status === 'active' ? 'bg-emerald-500/20 text-emerald-200 border-emerald-500/40' : 'bg-amber-500/20 text-amber-200 border-amber-500/40'">
            {{ network.status }}
          </span>
        </div>
        <div class="flex flex-wrap items-center gap-2 text-xs text-[var(--portal-text-muted)]">
          <span class="px-2 py-1 rounded-full border border-[var(--portal-border-strong)]">{{ network.trackingType }}</span>
          <span *ngFor="let market of network.markets" class="px-2 py-1 rounded-full border border-[var(--portal-border-strong)]">{{ market }}</span>
        </div>
        <button type="button"
          class="px-3 py-1.5 rounded-lg border border-[var(--portal-border-strong)] text-xs text-[var(--portal-text)] hover:border-[var(--portal-border-strong)]"
          (click)="edit(network)">
          Editar
        </button>
      </article>
    </div>
  </div>
</div>
