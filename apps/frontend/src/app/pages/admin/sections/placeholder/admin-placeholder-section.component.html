<section class="space-y-6">
  <div class="bg-[var(--portal-surface)] border border-[var(--portal-border)] rounded-2xl p-8">
    <h3 class="text-2xl font-semibold text-[var(--portal-text)] mb-2">{{ title }}</h3>
    <p class="text-sm text-[var(--portal-text-soft)]">
      This area is prepared for the next phase. Define workflows, data sources, and permissions to enable.
    </p>
    <span class="mt-4 inline-block text-[11px] px-3 py-1 rounded-full border border-amber-500/40 text-amber-200 bg-amber-500/10">Planned</span>
  </div>

  <div *ngIf="items.length" class="grid sm:grid-cols-2 xl:grid-cols-3 gap-4">
    <div *ngFor="let item of items" class="bg-[var(--portal-surface)] border border-[var(--portal-border)] rounded-2xl p-5">
      <div class="flex items-center justify-between">
        <p class="text-[var(--portal-text)] font-medium">{{ item.label }}</p>
        <span class="text-[11px] px-2 py-1 rounded-full border border-amber-500/40 text-amber-200 bg-amber-500/10">Planned</span>
      </div>
      <p class="text-xs text-[var(--portal-text-muted)] mt-2">{{ item.description }}</p>
    </div>
  </div>
</section>
