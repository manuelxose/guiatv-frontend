<section class="live-view">
  <header class="live-view__masthead">
    <div class="live-view__masthead-copy">
      <p class="live-view__eyebrow">TV en directo</p>
      <h1>{{ sectionTitle() }}</h1>
      <p>{{ sectionDescription() }}</p>
    </div>

    <div class="live-view__summary" *ngIf="activeFilters().length">
      <button
        *ngFor="let filter of activeFilters(); trackBy: trackByFilter"
        type="button"
        (click)="removeFilter(filter.key)"
        [attr.aria-label]="'Quitar filtro ' + filter.label"
      >
        {{ filter.label }} <span aria-hidden="true">×</span>
      </button>
      <button type="button" class="live-view__clear" (click)="clearFilters()">Limpiar</button>
    </div>
  </header>

  <nav class="live-view__basic-filters" aria-label="Filtrar por categoría">
    <span>Categoría</span>
    <button
      *ngFor="let category of categoryChips"
      type="button"
      [class.live-view__basic-filter--active]="guideState.liveFilters().category === category.id"
      (click)="selectCategory(category.id)"
    >
      {{ category.label }}
    </button>
  </nav>

  <section class="live-view__channels" *ngIf="topChannels().length">
    <header class="live-view__section-head">
      <div>
        <p class="live-view__eyebrow">Canales</p>
        <h2>Elige una señal</h2>
      </div>
    </header>
    <div class="live-view__channel-row">
      <button
        type="button"
        class="live-view__channel-chip"
        [class.live-view__channel-chip--active]="!guideState.liveFilters().channel"
        (click)="selectChannel('')"
      >
        <span class="live-view__channel-chip-copy"><strong>Todos</strong><small>Ver emisiones</small></span>
      </button>

      <button
        *ngFor="let channel of topChannels(); trackBy: trackByChannel"
        type="button"
        class="live-view__channel-chip"
        [class.live-view__channel-chip--active]="guideState.liveFilters().channel === channel.id"
        (click)="selectChannel(channel.id)"
      >
        <img *ngIf="channel.icon" [src]="channel.icon" alt="" loading="lazy" />
        <span class="live-view__channel-chip-copy"><strong>{{ channel.name }}</strong></span>
      </button>
    </div>
  </section>

  <div class="live-view__loading" *ngIf="loading()" aria-label="Cargando emisiones">
    <span></span><span></span><span></span>
  </div>

  <ng-container *ngIf="!loading()">
    <div class="live-view__grid-wrap" *ngIf="guideState.liveFilters().liveView === 'day'">
      <app-epg-grid [items]="allPrograms()"></app-epg-grid>
    </div>

    <div class="live-view__rails-wrap" *ngIf="guideState.liveFilters().liveView !== 'day' && visiblePrograms().length">
      <section class="live-view__feature-grid" *ngIf="leadPrograms().length">
        <app-unified-program-card
          [item]="leadPrograms()[0]"
          variant="feature"
        ></app-unified-program-card>

        <div class="live-view__feature-stack" *ngIf="leadPrograms().length > 1">
          <app-unified-program-card
            *ngFor="let item of leadPrograms().slice(1); trackBy: trackByItem"
            [item]="item"
            variant="compact"
          ></app-unified-program-card>
        </div>
      </section>

      <section class="live-view__section" *ngIf="gridPrograms().length">
        <header class="live-view__section-head">
          <div>
            <p class="live-view__eyebrow">Más opciones</p>
            <h2>Otras emisiones disponibles</h2>
          </div>
        </header>
        <div class="live-view__grid">
          <app-unified-program-card
            *ngFor="let item of gridPrograms(); trackBy: trackByItem"
            [item]="item"
            variant="compact"
          ></app-unified-program-card>
        </div>
      </section>
    </div>

    <section class="live-view__empty" *ngIf="!visiblePrograms().length">
      <h2>No hay emisiones con estos filtros</h2>
      <p>Vuelve a la selección principal para recuperar todos los canales en emisión.</p>
      <button type="button" (click)="clearFilters()">Ver emisiones</button>
    </section>
  </ng-container>

  <app-unified-filter-dock
    [open]="shellUi.isFilterDockOpen()"
    title="Más filtros"
    [activeCount]="activeFilters().length"
    [sections]="filterDockSections()"
    (close)="closeDock()"
    (clear)="clearFilters()"
    (select)="handleDockSelect($event)"
  ></app-unified-filter-dock>
</section>
