<app-unified-portal-shell
  class="unified-guide-page"
  [tone]="activeTab()"
  [topPillChips]="platformMode() === 'compare' ? [] : topPillChips()"
  [topPillSelection]="topPillSelection()"
  [topPillLabel]="topPillLabel()"
  [breadcrumbItems]="breadcrumbItems()"
  [showHero]="false"
  [showFilterButton]="platformMode() !== 'compare'"
  filterButtonLabel="Más filtros"
  [filterCount]="filterCount()"
  (topPillChange)="onTopPillChange($event)"
  (filterToggle)="toggleFilterDock()"
>
  <section id="tab-panel-live" role="tabpanel" *ngIf="activeTab() === 'live'">
    <app-live-guide-view></app-live-guide-view>
  </section>
  <section id="tab-panel-discover" role="tabpanel" *ngIf="activeTab() === 'discover'">
    <app-discover-view></app-discover-view>
  </section>
  <section id="tab-panel-streaming" role="tabpanel" *ngIf="activeTab() === 'streaming'">
    <app-streaming-view *ngIf="platformMode() === 'catalog'"></app-streaming-view>
    <app-streaming-comparison *ngIf="platformMode() === 'compare'"></app-streaming-comparison>
  </section>
</app-unified-portal-shell>
