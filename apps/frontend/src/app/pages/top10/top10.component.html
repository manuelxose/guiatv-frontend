<app-nav-bar></app-nav-bar>

<main class="min-h-screen bg-gradient-to-br from-gray-900 via-gray-800 to-black pb-20">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    
    <!-- Header -->
    <header class="mb-10">
      <h1 class="text-4xl sm:text-5xl font-extrabold text-white mb-3 tracking-tight">Top 10</h1>
      <p class="text-lg text-gray-400">Rankings basados en calidad y recomendaciones de la comunidad</p>
    </header>

    <!-- Category Tabs -->
    <nav class="flex items-center gap-2 overflow-x-auto pb-4 mb-10 border-b border-gray-700/50 scrollbar-hide">
      <button 
        (click)="setActiveTab('movies')"
        class="px-5 py-2.5 rounded-xl font-semibold text-sm transition-all whitespace-nowrap"
        [ngClass]="activeTab === 'movies' ? 'bg-red-600 text-white shadow-lg shadow-red-900/20' : 'text-gray-400 hover:text-white hover:bg-white/5'">
        🎬 Películas
      </button>
      <button 
        (click)="setActiveTab('series')"
        class="px-5 py-2.5 rounded-xl font-semibold text-sm transition-all whitespace-nowrap"
        [ngClass]="activeTab === 'series' ? 'bg-red-600 text-white shadow-lg shadow-red-900/20' : 'text-gray-400 hover:text-white hover:bg-white/5'">
        📺 Series
      </button>
      <button 
        (click)="setActiveTab('programs')"
        class="px-5 py-2.5 rounded-xl font-semibold text-sm transition-all whitespace-nowrap"
        [ngClass]="activeTab === 'programs' ? 'bg-red-600 text-white shadow-lg shadow-red-900/20' : 'text-gray-400 hover:text-white hover:bg-white/5'">
        🎙️ Programas
      </button>
      <button 
        (click)="setActiveTab('platforms')"
        class="px-5 py-2.5 rounded-xl font-semibold text-sm transition-all whitespace-nowrap"
        [ngClass]="activeTab === 'platforms' ? 'bg-red-600 text-white shadow-lg shadow-red-900/20' : 'text-gray-400 hover:text-white hover:bg-white/5'">
        🚀 Plataformas
      </button>
      <button 
        (click)="setActiveTab('community')"
        class="px-5 py-2.5 rounded-xl font-semibold text-sm transition-all whitespace-nowrap"
        [ngClass]="activeTab === 'community' ? 'bg-red-600 text-white shadow-lg shadow-red-900/20' : 'text-gray-400 hover:text-white hover:bg-white/5'">
        👥 Comunidad
      </button>
    </nav>

    <!-- Ranking List -->
    <div class="space-y-3">
      <article 
        *ngFor="let item of currentTop10; trackBy: trackByItemId"
        class="group relative bg-gray-800/40 border border-gray-700/40 rounded-2xl p-5 hover:bg-gray-800/60 hover:border-gray-600/60 transition-all cursor-pointer shadow-lg shadow-black/20">
        
        <div class="flex items-center gap-6">
          <!-- Rank Number -->
          <div class="flex-shrink-0 w-16 text-center">
            <span class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-br from-red-500 to-red-700">
              {{ item.rank }}
            </span>
            <div *ngIf="item.change" class="flex items-center justify-center mt-1">
              <span 
                class="text-xs font-bold"
                [ngClass]="{
                  'text-green-400': item.change === 'up',
                  'text-red-400': item.change === 'down',
                  'text-yellow-400': item.change === 'new',
                  'text-gray-500': item.change === 'same'
                }">
                <ng-container [ngSwitch]="item.change">
                  <span *ngSwitchCase="'up'">▲</span>
                  <span *ngSwitchCase="'down'">▼</span>
                  <span *ngSwitchCase="'new'">★</span>
                  <span *ngSwitchCase="'same'">═</span>
                </ng-container>
              </span>
            </div>
          </div>

          <!-- Image -->
          <div class="h-24 w-40 rounded-xl overflow-hidden flex-shrink-0 border border-gray-700/50">
            <img 
              [src]="item.image" 
              [alt]="item.title"
              class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
          </div>

          <!-- Content -->
          <div class="flex-1 min-w-0">
            <div class="flex items-start justify-between gap-4 mb-2">
              <div class="flex-1 min-w-0">
                <h3 class="text-2xl font-bold text-white leading-tight truncate group-hover:text-red-400 transition-colors">
                  {{ item.title }}
                </h3>
                <p class="text-sm text-gray-400 mt-1">
                  {{ getTypeLabel(item.type) }}
                </p>
              </div>

              <!-- Rating -->
              <div class="flex items-center gap-2 bg-yellow-500/20 border border-yellow-500/30 px-4 py-2 rounded-xl flex-shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-yellow-400" viewBox="0 0 20 20" fill="currentColor">
                  <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                </svg>
                <span class="text-lg font-bold text-yellow-400">{{ item.rating }}</span>
              </div>
            </div>

            <!-- Platform / Channel -->
            <div class="flex items-center gap-3 mb-2">
              <span *ngIf="item.platform" 
                class="inline-block px-3 py-1 bg-blue-500/20 text-blue-300 text-xs font-bold uppercase tracking-wider rounded-full border border-blue-500/30">
                {{ item.platform }}
              </span>
              <span *ngIf="item.channel" 
                class="inline-block px-3 py-1 bg-purple-500/20 text-purple-300 text-xs font-bold uppercase tracking-wider rounded-full border border-purple-500/30">
                {{ item.channel }}
              </span>
            </div>

            <!-- Social Badge -->
            <div *ngIf="item.socialBadge" class="flex items-center gap-2 text-sm text-gray-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-green-400" viewBox="0 0 20 20" fill="currentColor">
                <path d="M2 10.5a1.5 1.5 0 113 0v6a1.5 1.5 0 01-3 0v-6zM6 10.333v5.43a2 2 0 001.106 1.79l.05.025A4 4 0 008.943 18h5.416a2 2 0 001.962-1.608l1.2-6A2 2 0 0015.56 8H12V4a2 2 0 00-2-2 1 1 0 00-1 1v.667a4 4 0 01-.8 2.4L6.8 7.933a4 4 0 00-.8 2.4z" />
              </svg>
              <span class="text-green-400 font-medium">{{ item.socialBadge }}</span>
            </div>
          </div>

          <!-- Add to List Button -->
          <button class="flex-shrink-0 p-3 bg-gray-900/60 hover:bg-red-600 text-gray-400 hover:text-white rounded-xl transition-all border border-gray-700/50 hover:border-red-500/50">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor">
              <path d="M8 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z" />
              <path d="M6 3a2 2 0 00-2 2v11a2 2 0 002 2h8a2 2 0 002-2V5a2 2 0 00-2-2 3 3 0 01-3 3H9a3 3 0 01-3-3z" />
            </svg>
          </button>
        </div>
      </article>
    </div>
  </div>
</main>
