<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Guía de Programación TV - Encuentra tus programas favoritos</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Consulta nuestra completa guía de programación TV y descubre los horarios de tus programas, series y películas favoritas en todos los canales de televisión."
    />
    <meta
      name="keywords"
      content="guía TV, programación TV, horarios televisión, guía de programas, series, películas, canales de televisión, programación de canales, televisión en vivo"
    />
    <meta name="author" content="TecnoRia" />
    
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GuíaProgramaciónTV" />
    <meta property="og:title" content="Guía de Programación TV - Encuentra tus programas favoritos" />
    <meta property="og:description" content="Consulta nuestra completa guía de programación TV y descubre los horarios de tus programas, series y películas favoritas en todos los canales de televisión." />
    <meta property="og:url" content="https://guiaprogramaciontv.com/" />
    <meta property="og:locale" content="es_ES" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
    
    <!-- Critical CSS inline (estilos mínimos para above-the-fold) -->
    <style>
      /* Critical CSS - Evita FOUC */
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        background: linear-gradient(to bottom right, #111827, #1f2937, #000);
        min-height: 100vh;
        color: #fff;
      }
      app-root {
        display: block;
        min-height: 100vh;
      }
      /* Placeholder mientras carga la app */
      app-root:empty::before {
        content: '';
        display: block;
        width: 100%;
        height: 100vh;
        background: linear-gradient(to bottom right, #111827, #1f2937, #000);
      }
    </style>
  </head>
  <body>
    <app-root></app-root>

    <!-- Prefetch de rutas probables después de carga inicial -->
    <script>
      // Prefetch de recursos después de que la página esté idle
      if ('requestIdleCallback' in window) {
        requestIdleCallback(function() {
          // Prefetch de iconos de canales populares
          var popularChannels = ['la_1', 'la_2', 'antena_3', 'cuatro', 'telecinco'];
          popularChannels.forEach(function(channel) {
            var link = document.createElement('link');
            link.rel = 'prefetch';
            link.href = '/storage/channel_icons/' + channel + '.webp';
            link.as = 'image';
            document.head.appendChild(link);
          });
        });
      }
    </script>
  </body>
</html>
