<!-- 
  Home Component - REBUILD
  Objetivo: ProgramList es el elemento PRINCIPAL
  - El banner featured es secundario y compacto en móvil
  - La parrilla de canales ocupa el máximo espacio
-->

<!-- Skip Link for Accessibility -->
<a href="#programacion" class="skip-link">
  Ir al contenido principal
</a>

<!-- NavBar (ya existente) -->
<app-nav-bar></app-nav-bar>

<!-- Main Content -->
<main class="home">

  <!-- ============================================ -->
  <!-- LOADING STATE                               -->
  <!-- ============================================ -->
  <div *ngIf="uiState().isLoading" class="home__loading">
    <div class="home__loading-content">
      <div class="home__loading-spinner"></div>
      <p>Cargando Guía TV...</p>
    </div>
  </div>

  <!-- ============================================ -->
  <!-- ERROR STATE                                 -->
  <!-- ============================================ -->
  <div *ngIf="uiState().showError" class="home__error">
    <div class="home__error-content">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 8v4m0 4h.01"/>
      </svg>
      <h2>Error al cargar</h2>
      <p>{{ error() }}</p>
      <button (click)="onRefresh()" class="home__error-btn">
        Reintentar
      </button>
    </div>
  </div>

  <!-- ============================================ -->
  <!-- MAIN CONTENT                                -->
  <!-- ============================================ -->
  <div *ngIf="uiState().showContent" class="home__content">

    <!-- Mobile: Mini header con stats (muy compacto) -->
    <header class="home__header home__header--mobile" *ngIf="deviceDetector.isMobile()">
      <h1 class="home__title">Guía TV</h1>
      <div class="home__stats">
        <span class="home__stat">
          <span class="home__stat-icon">📺</span>
          <span class="home__stat-value">{{ programs().length || '80+' }}</span>
          <span class="home__stat-label">canales</span>
        </span>
      </div>
    </header>

    <!-- Desktop: Hero section (compacto) -->
    <header class="home__header home__header--desktop" *ngIf="!deviceDetector.isMobile()">
      <div class="home__hero">
        <h1 class="home__hero-title">Guía de Programación TV España</h1>
        <p class="home__hero-subtitle">
          Consulta toda la programación de televisión actualizada en tiempo real
        </p>
      </div>
    </header>

    <!-- Featured Banner (SOLO si hay película destacada y NO hay filtro de categoría) -->
    <section 
      *ngIf="uiState().hasFeaturedMovie && !selectedCategory()" 
      class="home__featured"
      aria-label="Película destacada"
    >
      <app-banner
        [data]="getBannerData()"
        [compact]="deviceDetector.isMobile()"
        (movieSelected)="onMovieSelected($event)"
      ></app-banner>
    </section>

    <!-- Active Category Filter Indicator -->
    <div *ngIf="selectedCategory()" class="home__filter-active">
      <span>Filtrando por: <strong>{{ selectedCategory() }}</strong></span>
      <button (click)="clearCategoryFilter()" aria-label="Limpiar filtro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
        Limpiar
      </button>
    </div>

    <!-- ============================================ -->
    <!-- PROGRAM LIST - EL ELEMENTO PRINCIPAL       -->
    <!-- ============================================ -->
    <section id="programacion" class="home__programs" aria-label="Programación de televisión">
      <app-program-list
        (dayChanged)="onDayChanged($event)"
        (categorySelected)="onCategorySelected($event)"
      ></app-program-list>
    </section>

  </div>

</main>
