<!-- Native Slider - Optimizado para datos reales -->
<section
  class="native-slider"
  [ngClass]="'slider--' + (variant || 'default')"
  [attr.aria-label]="
    'Carrusel de ' +
    (variant === 'peliculas'
      ? 'películas'
      : variant === 'series'
      ? 'series'
      : 'programas')
  "
>
  <!-- Scroll Container -->
  <div #scrollContainer class="slider-scroll-container" role="list">
    <article
      *ngFor="let program of programas; index as i; trackBy: trackByProgram"
      class="slider-item"
      role="listitem"
    >
      <app-card-slider
        [title]="program?.title?.value || program?.title || 'Programa'"
        [subtitle]="program?.channel?.name || program?.channelName || 'Canal'"
        [channelIcon]="program?.channelIcon || program?.icon || program?.channel?.icon || ''"
        [time]="program?.start ? horaInicio(i) : ''"
        [image]="program?.image || program?.poster || program?.background || program?.icon"
        [badge]="''"
        badgeColor="gray"
        [live]="false"
        [id]="program?.id || program?.uuid || ''"
        [type]="variant === 'series' ? 'series' : (variant === 'peliculas' ? 'movie' : 'program')"
        (cardClick)="manageData(program)"
      ></app-card-slider>
    </article>
  </div>

  <!-- Controles de navegación -->
  <div
    class="slider-nav"
    role="group"
    aria-label="Controles"
    *ngIf="isBrowser && hasMultipleSlides()"
  >
    <button
      class="slider-nav-btn slider-nav-prev"
      type="button"
      aria-label="Anterior"
      [disabled]="!canScrollPrev()"
      (click)="prev()"
    >
      ‹
    </button>
    <button
      class="slider-nav-btn slider-nav-next"
      type="button"
      aria-label="Siguiente"
      [disabled]="!canScrollNext()"
      (click)="next()"
    >
      ›
    </button>
  </div>
</section>
