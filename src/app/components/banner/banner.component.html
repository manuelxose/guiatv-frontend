<!-- 
  Banner Component - VERSIÓN OPTIMIZADA PARA LCP
  
  Optimizaciones aplicadas:
  1. srcset con tamaños específicos por breakpoint
  2. Atributo sizes optimizado para cada viewport
  3. Logo de canal con srcset para retina
  4. Dimensiones explícitas para evitar CLS
  5. fetchpriority="high" para imagen principal
-->
<article
  *ngIf="bannerData"
  class="banner-hero"
  [class.banner-compact]="compact"
  itemscope
  itemtype="https://schema.org/VideoObject"
>
  <!-- ============================================
       IMAGEN DE FONDO OPTIMIZADA
       ============================================ -->
  <div class="banner-background">
    <img
      class="banner-bg-image"
      [src]="getBannerImageUrl(bannerData, isMobile ? 768 : 1440)"
      [srcset]="getBannerSrcset(getProgramPosterUrl(bannerData))"
      [sizes]="getBannerSizes()"
      [alt]="'Imagen de ' + (bannerData.title?.value || 'programa')"
      [attr.loading]="compact ? 'lazy' : 'eager'"
      [attr.fetchpriority]="compact ? 'auto' : 'high'"
      decoding="async"
      width="1920"
      height="800"
      (error)="onImageError($event)"
    />
    <!-- Gradient overlay para legibilidad del texto -->
    <div class="banner-overlay"></div>
  </div>

  <!-- ============================================
       CONTENIDO DEL BANNER
       ============================================ -->
  <div class="banner-content">
    
    <!-- Top section: Canal y horario -->
    <header class="banner-header">
      <div class="channel-info">
        <!-- Logo del canal OPTIMIZADO -->
        <img
          [class]="compactLogo ? 'channel-logo-small' : 'channel-logo'"
          [src]="getChannelLogoUrl(bannerData.channel)"
          [srcset]="getChannelLogoSrcset(bannerData.channel)"
          [alt]="bannerData.channel + ' logo'"
          loading="lazy"
          decoding="async"
          width="60"
          height="40"
          (error)="onImageError($event)"
        />
        <span class="channel-name" itemprop="provider">
          {{ bannerData.channel }}
        </span>
      </div>

      <!-- Horario -->
      <div *ngIf="!hideTopTime" class="time-badge">
        <time [attr.datetime]="bannerData.start" itemprop="startDate">
          {{ getHora(bannerData.start) }}
        </time>
        <span class="time-separator">—</span>
        <time [attr.datetime]="bannerData.stop" itemprop="endDate">
          {{ getHora(bannerData.stop) }}
        </time>
      </div>
    </header>

    <!-- Bottom section: Información del programa -->
    <div class="banner-info">
      <!-- Título -->
      <h2 class="program-title" itemprop="name">
        {{ bannerData.title?.value }}
      </h2>

      <!-- Metadata -->
      <ul class="program-metadata">
        <li *ngIf="bannerData.desc?.year" itemprop="datePublished">
          {{ bannerData.desc.year }}
        </li>
        <li *ngIf="bannerData.category?.value">
          <span itemprop="genre">{{ bannerData.category.value }}</span>
        </li>
        <li *ngIf="time" class="duration">
          <svg 
            class="duration-icon" 
            viewBox="0 0 24 24" 
            fill="none" 
            stroke="currentColor" 
            stroke-width="2"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 6v6l4 2"/>
          </svg>
          <span itemprop="duration">{{ time }}</span>
        </li>
        <li *ngIf="bannerData.starRating" class="rating">
          <svg 
            class="star-icon" 
            viewBox="0 0 24 24" 
            fill="currentColor"
            aria-hidden="true"
          >
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
          </svg>
          <span>{{ bannerData.starRating }}</span>
        </li>
        <li *ngIf="bannerData.desc?.rate" class="age-rating">
          {{ bannerData.desc.rate }}
        </li>
      </ul>

      <!-- Descripción -->
      <p 
        *ngIf="bannerData.desc?.details" 
        class="program-description"
        [class.program-description--full]="showFullDescription"
        itemprop="description"
      >
        {{ bannerData.desc.details }}
      </p>

      <!-- Botones de acción -->
      <div class="banner-actions">
        <button 
          class="btn-primary" 
          (click)="navigateTo()"
          type="button"
        >
          <svg 
            class="btn-icon" 
            viewBox="0 0 24 24" 
            fill="currentColor"
            aria-hidden="true"
          >
            <path d="M8 5v14l11-7z"/>
          </svg>
          <span>Ver más</span>
        </button>
        
        <button 
          class="btn-secondary" 
          (click)="addReminder()"
          type="button"
          aria-label="Añadir recordatorio"
        >
          <svg 
            class="btn-icon" 
            viewBox="0 0 24 24" 
            fill="none" 
            stroke="currentColor" 
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="M12 5v14M5 12h14"/>
          </svg>
          <span class="btn-text-desktop">Recordatorio</span>
        </button>

        <!-- Interaction buttons component -->
        <app-interaction-buttons
          *ngIf="bannerData.id"
          [itemId]="bannerData.id"
          [compact]="true"
          class="interaction-buttons"
        ></app-interaction-buttons>
      </div>
    </div>
  </div>
</article>

<!-- Estado vacío -->
<div 
  *ngIf="!bannerData" 
  class="banner-placeholder"
  role="img"
  aria-label="Cargando banner"
>
  <div class="banner-placeholder-content">
    <div class="banner-placeholder-shimmer"></div>
  </div>
</div>
