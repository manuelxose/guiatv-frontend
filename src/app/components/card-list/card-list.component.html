<div
  class="card-list group relative flex w-full cursor-pointer flex-col overflow-hidden rounded-xl bg-gray-900 shadow-lg transition-all duration-300 hover:shadow-2xl hover:shadow-red-500/10 sm:flex-row sm:h-[11.25rem]"
  (click)="onClick()"
  role="article"
  [attr.aria-label]="title"
>
  <!-- Image Section -->
  <div class="relative h-48 w-full sm:h-full sm:w-[13.75rem] lg:w-[16.25rem] flex-shrink-0 overflow-hidden">
    <div
      class="absolute inset-0 bg-cover bg-center transition-transform duration-500 group-hover:scale-110"
      [style.background-image]="backgroundImage"
    ></div>
    <div
      class="absolute inset-0 bg-gradient-to-t from-gray-900 via-transparent to-transparent sm:bg-gradient-to-r sm:from-transparent sm:via-transparent sm:to-gray-900"
    ></div>

    <!-- Live Badge -->
    <div *ngIf="live" class="absolute top-3 left-3 z-10">
      <span
        class="flex items-center gap-1.5 rounded-full bg-red-600/90 px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-white shadow-sm backdrop-blur-sm"
      >
        <span class="relative flex h-2 w-2">
          <span
            class="absolute inline-flex h-full w-full animate-ping rounded-full bg-white opacity-75"
          ></span>
          <span
            class="relative inline-flex h-2 w-2 rounded-full bg-white"
          ></span>
        </span>
        En Vivo
      </span>
    </div>

    <!-- Category Badge -->
    <div *ngIf="category" class="absolute bottom-3 left-3 z-10">
      <span
        class="rounded-md bg-black/60 px-2 py-1 text-[10px] font-medium text-white backdrop-blur-sm"
      >
        {{ category }}
      </span>
    </div>
  </div>

  <!-- Content Section -->
  <div class="flex flex-1 flex-col justify-between p-4 sm:p-5 min-w-0">
    <div>
      <!-- Header -->
      <div class="mb-2 flex items-center justify-between">
        <span
          class="text-xs font-bold text-red-400 uppercase tracking-wide"
          *ngIf="subtitle"
        >
          {{ subtitle }}
        </span>
        <span *ngIf="time" class="flex items-center gap-1 text-xs text-gray-400">
          <svg
            class="h-3 w-3"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
          {{ time }}
        </span>
      </div>

      <!-- Title -->
      <h3
        class="mb-2 text-lg lg:text-xl font-bold leading-tight text-white group-hover:text-red-400 transition-colors"
      >
        {{ title }}
      </h3>

      <!-- Description -->
      <p class="line-clamp-2 text-xs lg:text-sm text-gray-400 leading-relaxed">
        {{ description }}
      </p>
    </div>

    <!-- Footer / Actions -->
    <div class="mt-4 flex items-center justify-between">
      <!-- Progress Bar (if live) -->
      <div *ngIf="live" class="flex-1 mr-4">
        <div class="h-1.5 w-full overflow-hidden rounded-full bg-gray-700">
          <div
            class="h-full bg-red-500 transition-all duration-1000"
            [style.width.%]="progress || 50"
          ></div>
        </div>
        <p class="mt-1 text-[10px] text-gray-400 text-right">Emitiendo ahora</p>
      </div>

      <!-- Actions -->
      <div class="flex items-center gap-2" [class.ml-auto]="!live">
        <button
          class="group/btn flex items-center gap-1.5 rounded-lg bg-gray-800 px-3 py-1.5 text-xs font-medium text-gray-300 transition-colors hover:bg-gray-700 hover:text-white"
          (click)="onRemind($event)"
          title="Recordar"
        >
          <svg
            class="h-4 w-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
            />
          </svg>
          <span class="hidden sm:inline">Recordar</span>
        </button>

        <button
          class="flex items-center gap-1.5 rounded-lg bg-red-600/10 px-3 py-1.5 text-xs font-medium text-red-400 transition-colors group-hover:bg-red-600 group-hover:text-white"
        >
          <span>Ver Detalles</span>
          <svg
            class="h-3 w-3"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 5l7 7-7 7"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
