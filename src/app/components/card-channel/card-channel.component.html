<!-- card-channel.component.html - VERSIÓN OPTIMIZADA -->
<!-- Cambios:
  1. Añadido srcset para soporte retina
  2. Tamaños de imagen correctos (100x65 en lugar de 368x240)
  3. Añadido loading="lazy" y decoding="async"
  4. Dimensiones explícitas para evitar CLS
-->
<div
  class="card-channel group relative flex flex-col overflow-hidden rounded-xl bg-gray-900 shadow-lg transition-all duration-300 cursor-pointer hover:shadow-2xl hover:shadow-red-500/10"
  [class.opacity-50]="!isActive"
  [class.cursor-not-allowed]="!isActive"
  (click)="onClick()"
  role="article"
  [attr.aria-label]="name"
  tabindex="0"
  (keydown.enter)="onClick()"
  (keydown.space)="onClick()"
>
  <!-- Image Section with Optimized Loading -->
  <div class="relative aspect-[84/55] w-full overflow-hidden bg-gray-800">
    <!-- Imagen optimizada con srcset para retina -->
    <img
      [src]="imageSrc"
      [srcset]="imageSrcset"
      [alt]="name"
      loading="lazy"
      decoding="async"
      width="100"
      height="65"
      class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105"
      (error)="onImageError($event)"
    />
    
    <!-- Gradient overlay -->
    <div class="absolute inset-0 bg-gradient-to-t from-gray-900/60 via-transparent to-transparent"></div>

    <!-- Type Badge -->
    <div *ngIf="type" class="absolute top-2 left-2 z-10">
      <span class="rounded-md bg-red-600/90 px-1.5 py-0.5 text-[9px] font-bold uppercase tracking-wider text-white shadow-sm backdrop-blur-sm">
        {{ type }}
      </span>
    </div>

    <!-- Region Badge -->
    <div *ngIf="region" class="absolute top-2 right-2 z-10">
      <span class="rounded-md bg-black/60 px-1.5 py-0.5 text-[9px] font-medium text-gray-300 backdrop-blur-sm">
        {{ region }}
      </span>
    </div>

    <!-- Inactive Overlay -->
    <div *ngIf="!isActive" class="absolute inset-0 flex items-center justify-center z-20 bg-black/50">
      <span class="text-xs font-semibold text-gray-300 bg-black/80 px-3 py-1 rounded-full">
        No disponible
      </span>
    </div>
  </div>

  <!-- Channel Info -->
  <div class="p-3">
    <h3 class="text-sm font-bold text-white line-clamp-2 leading-tight group-hover:text-red-400 transition-colors min-h-[2.5rem]">
      {{ name }}
    </h3>
  </div>

  <!-- Hover Play Icon -->
  <div
    *ngIf="isActive"
    class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none"
  >
    <div class="w-12 h-12 bg-red-600/90 rounded-full flex items-center justify-center shadow-lg backdrop-blur-sm transform scale-90 group-hover:scale-100 transition-transform">
      <svg class="w-6 h-6 text-white ml-0.5" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
        <path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z"></path>
      </svg>
    </div>
  </div>
</div>
