<div
  class="card-slider group relative w-full aspect-[2/3] flex-shrink-0 cursor-pointer overflow-hidden rounded-xl bg-gray-900 shadow-lg transition-all duration-300 hover:scale-105 hover:shadow-2xl hover:shadow-red-500/20"
  (click)="onClick()"
  role="button"
  [attr.aria-label]="title"
>
  <!-- Background Image -->
  <div
    class="absolute inset-0 bg-cover bg-center transition-transform duration-500 group-hover:scale-110"
    [style.background-image]="backgroundImage"
  ></div>

  <!-- Gradient Overlay -->
  <div
    class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent opacity-80 transition-opacity duration-300 group-hover:opacity-90"
  ></div>

  <!-- Live Badge -->
  <div *ngIf="live" class="absolute top-3 left-3 z-10">
    <span
      class="flex items-center gap-1.5 rounded-full bg-red-600/90 px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-white shadow-sm backdrop-blur-sm"
    >
      <span class="relative flex h-2 w-2">
        <span
          class="absolute inline-flex h-full w-full animate-ping rounded-full bg-white opacity-75"
        ></span>
        <span
          class="relative inline-flex h-2 w-2 rounded-full bg-white"
        ></span>
      </span>
      En Vivo
    </span>
  </div>

  <!-- Channel Logo (Top Right) -->
  <div *ngIf="channelIcon" class="absolute top-3 right-3 z-10">
    <img 
      [src]="channelIcon" 
      [alt]="subtitle"
      class="h-8 w-8 rounded-md object-contain bg-white/20 backdrop-blur-sm p-1 shadow-lg border border-white/20"
      (error)="$any($event.target).style.display='none'"
    />
  </div>

  <!-- Social Actions (Top Left) -->
  <div class="absolute top-3 left-3 z-20 opacity-0 group-hover:opacity-100 transition-opacity duration-300" (click)="$event.stopPropagation()">
    <app-interaction-buttons
      [itemId]="id"
      [title]="title"
      [type]="type"
      [compact]="true"
    ></app-interaction-buttons>
  </div>

  <!-- Content -->
  <div class="absolute bottom-0 left-0 w-full p-4">
    <!-- Channel/Subtitle -->
    <div class="mb-2 flex items-center gap-2">
      <span
        class="text-sm font-semibold text-red-400 uppercase tracking-wide"
        *ngIf="subtitle"
      >
        {{ subtitle }}
      </span>
    </div>

    <!-- Title -->
    <h3
      class="mb-2 text-lg font-bold leading-tight text-white line-clamp-2 group-hover:text-red-100"
    >
      {{ title }}
    </h3>

    <!-- Time/Metadata -->
    <div class="flex items-center justify-between text-sm text-gray-300">
      <span *ngIf="time" class="flex items-center gap-1">
        <svg
          class="h-4 w-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
          />
        </svg>
        {{ time }}
      </span>
    </div>
  </div>

  <!-- Hover Overlay (Play Icon) -->
  <div
    class="absolute inset-0 flex items-center justify-center opacity-0 transition-opacity duration-300 group-hover:opacity-100"
  >
    <div
      class="flex h-12 w-12 items-center justify-center rounded-full bg-red-600/90 text-white shadow-lg backdrop-blur-sm transform translate-y-4 group-hover:translate-y-0 transition-transform duration-300"
    >
      <svg
        class="h-6 w-6 ml-1"
        fill="currentColor"
        viewBox="0 0 20 20"
      >
        <path
          d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z"
        />
      </svg>
    </div>
  </div>
</div>
