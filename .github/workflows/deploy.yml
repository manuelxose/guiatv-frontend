name: Deploy a producción (Contabo)

on:
  push:
    branches: [main]
    # Nothing here changes what runs in production, so it must not build on the VPS or restart the services
    # (a documentation PR used to trigger a full deploy). Keep in step with DOCS_ONLY_REGEX in deploy-guiatv.sh. The post-boot
    # check and guiatv-ops.sh run from the server checkout, which only advances on a deploy, so they are deliberately not listed.
    paths-ignore:
      - 'docs/**'
      - 'graphify-out/**'
      - 'tasks/**'
      - 'design/**'
      - 'artifacts/**'
      - '.github/workflows/uptime.yml'
      - 'scripts/uptime-probe*'
      - 'scripts/canary-legacy-probe.mjs'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Desplegar vía SSH (build en servidor + smoke)
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 25m
          script: |
            sudo /var/www/guiatv/deploy-guiatv.sh
