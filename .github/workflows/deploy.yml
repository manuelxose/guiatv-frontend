name: Deploy a producción (Contabo)

# Manual only (Phase 3E). This workflow compiles ON the VPS, the path that was running during the 2026-10-20/21 outages, so a
# merge must never start it unexpectedly. The default release path is deploy-artifact.yml (CI builds, the server only
# verifies and publishes). Run this one by hand only if the artifact route is unavailable.
on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Desplegar vía SSH (build en servidor + smoke)
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 25m
          script: |
            sudo /var/www/guiatv/deploy-guiatv.sh
