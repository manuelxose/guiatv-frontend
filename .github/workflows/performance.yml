name: Build, test, and performance budgets

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    # ponytail: pinned for its 6.8 kernel. mongod 8.x refuses to start on kernels 6.19–7.0.13
    # (SERVER-121912), and ubuntu-24.04 runners moved to 7.0.0 on 2026-10-18. Return to
    # ubuntu-latest once the runner kernel is >= 7.0.14 or a fixed mongo:8.0 image ships.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TZ: Europe/Madrid # production runs in this zone; several tests assert Madrid wall-clock times
      TEST_MONGO_URI: mongodb://127.0.0.1:27017 # content-identity integrity tests; throwaway db per run
    services:
      mongo: # standalone, like production (no replica set, no transactions)
        image: mongo:8.0
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint:backend
      - run: npm run lint:frontend
      - run: npm run test:backend
      - run: npm run test:deploy
      - run: npm run test:ops
      - name: Install the Playwright Chromium used by Karma
        run: npx playwright install --with-deps chromium
      - run: npm run test:frontend
      - name: Production build with Angular bundle budgets
        run: npm run build
